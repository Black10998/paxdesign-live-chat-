name: PAXCustomerPortal
options:
  bundleIdPrefix: at.paxdesign
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PAXCustomerPortal:
    type: application
    platform: iOS
    sources:
      - path: PAXCustomerPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.customerportal
        INFOPLIST_KEY_CFBundleDisplayName: PAXDesign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Notifications for project updates, messages, and announcements."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PAXDesign
        NSUserNotificationsUsageDescription: "Notifications for project updates, messages, and announcements."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification

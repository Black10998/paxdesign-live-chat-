<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VIP — Cipher Phantom">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="58" fill="url(#glow)"/>

    <g transform="translate(64 64)" filter="url(#soft)">
      <circle r="28" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5 5">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#22d3ee">&#x29BF;</text>
    </g>  </g>
</svg>

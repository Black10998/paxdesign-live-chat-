<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VIP — Code Oracle">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="58" fill="url(#glow)"/>

    <g filter="url(#soft)">
      <rect x="36" y="40" width="56" height="48" rx="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <text x="64" y="72" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" fill="#60a5fa">⟨/⟩
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <line x1="44" y1="52" x2="84" y2="52" stroke="#60a5fa" stroke-width="1" opacity="0.5">
        <animate attributeName="x2" values="84;56;84" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VIP — AI Architect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1f"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="58" fill="url(#glow)"/>

    <g transform="translate(64 64)" filter="url(#soft)">
      <polygon points="0,-30 26,15 -26,15" fill="none" stroke="#818cf8" stroke-width="2"/>
      <polygon points="0,-18 16,9 -16,9" fill="#818cf8" opacity="0.25">
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.5s" repeatCount="indefinite"/>
      </polygon>
      <g>
        <line x1="-26" y1="15" x2="26" y2="15" stroke="#818cf8" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VIP — Sentinel Prime">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="58" fill="url(#glow)"/>

    <g filter="url(#soft)">
      <circle cx="64" cy="64" r="30" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.5"/>
      <line x1="64" y1="64" x2="64" y2="34" stroke="#f87171" stroke-width="2.5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="4s" repeatCount="indefinite"/>
      </line>
      <circle cx="82" cy="48" r="4" fill="#f87171">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>  </g>
</svg>

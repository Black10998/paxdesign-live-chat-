<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VIP — PAXDesign Elite">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="100%" stop-color="#003d82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="58" fill="url(#glow)"/>

    <g filter="url(#soft)">
      <circle cx="64" cy="64" r="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45">
        <animate attributeName="r" values="34;38;34" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="64" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#ffffff">PAX</text>
      <text x="64" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" letter-spacing="2" fill="#ffffff" opacity="0.85">ELITE</text>
      <g transform="translate(64 64)">
        <circle r="2.5" fill="#ffffff" cx="0" cy="-42">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>  </g>
</svg>

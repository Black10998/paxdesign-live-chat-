name: PAXDesignLiveChat
options:
  bundleIdPrefix: at.paxdesign
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - ar
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.1.1"
    CURRENT_PROJECT_VERSION: "184"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PAXDesignLiveChat:
    type: application
    platform: iOS
    sources:
      - path: PAXDesignLiveChat
    dependencies:
      - target: PAXWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.livechat
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: PAXDesign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Notifications for chat, projects, orders, and account updates."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID is used to unlock the app after inactivity."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select photos from your library to send in chat."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to send in chat conversations."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is used to record and send voice messages in chat."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location is used to verify device sign-ins, support secure staff device management, and share your position in team chat when you choose."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: PAXDesignLiveChat/PAXDesignLiveChat.entitlements
    info:
      path: PAXDesignLiveChat/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PAXDesign
        NSCameraUsageDescription: "Take photos to send in chat conversations."
        NSFaceIDUsageDescription: "Face ID is used to unlock the app after inactivity."
        NSMicrophoneUsageDescription: "Microphone access is used to record and send voice messages in chat."
        NSLocationWhenInUseUsageDescription: "Location is used to verify device sign-ins, support secure staff device management, and share your position in team chat when you choose."
        NSPhotoLibraryUsageDescription: "Select photos from your library to send in chat."
        NSUserNotificationsUsageDescription: "Notifications for chat, projects, orders, and account updates."
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - de
          - ar
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        PAXSignedAPSEnvironment: production
        CFBundleURLTypes:
          - CFBundleURLName: at.paxdesign.livechat
            CFBundleURLSchemes:
              - paxlivechat
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen:
          UIColorName: LaunchBackground
  PAXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PAXWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.livechat.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: PAXWidgets/PAXWidgets.entitlements
    info:
      path: PAXWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PAXDesign Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PAXDesignLiveChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PAXDesignLiveChatTests
    dependencies:
      - target: PAXDesignLiveChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.livechat.tests
        GENERATE_INFOPLIST_FILE: YES
  PAXDesignLiveChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PAXDesignLiveChatUITests
    dependencies:
      - target: PAXDesignLiveChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.livechat.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PAXDesignLiveChat:
    build:
      targets:
        PAXDesignLiveChat: all
    test:
      targets:
        - PAXDesignLiveChatTests
        - PAXDesignLiveChatUITests
      gatherCoverageData: false
  PAXDesignLiveChatLayoutVerify:
    build:
      targets:
        PAXDesignLiveChat: all
    test:
      targets:
        - PAXDesignLiveChatUITests
      gatherCoverageData: false

name: PAXDesignLiveChat
options:
  bundleIdPrefix: at.paxdesign
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - ar
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.16.0"
    CURRENT_PROJECT_VERSION: "29"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PAXDesignLiveChat:
    type: application
    platform: iOS
    sources:
      - path: PAXDesignLiveChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.paxdesign.livechat
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: PAXDesign Live Chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Notifications for live agent requests and new customer messages."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID is used to unlock the app after inactivity."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select photos from your library to send in live chat."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: PAXDesignLiveChat/PAXDesignLiveChat.entitlements
    info:
      path: PAXDesignLiveChat/Info.plist
      properties:
        CFBundleLocalizations:
          - en
          - de
          - ar
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: at.paxdesign.livechat
            CFBundleURLSchemes:
              - paxlivechat
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen:
          UIImageName: AppMark
          UIColorName: LaunchBackground

name: Deploy Apple homepage hero mobile gap

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-home-hero-mobile-gap-cfc9'
    paths:
      - '.github/triggers/deploy-apple-home-hero-mobile-gap'
      - '.github/workflows/deploy-apple-home-hero-mobile-gap.yml'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy homepage hero mobile styles
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css")"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-homepage.css \
            "${REMOTE}:${THEME}/assets/css/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple homepage hero mobile gap fix"

      - name: Verify live homepage hero CSS
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' "https://paxdesign.at/?n=${stamp}")
          test "$code" = "200"
          CSS=$(curl -sS -o /tmp/apple-homepage.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-homepage.css?ver=1.2.6&n=${stamp}")
          test "$CSS" = "200"
          grep -Eq "tighter ticker|min-height: min\\(58vh|object-position: center 30%" /tmp/apple-homepage.css
          grep -Eq "apple-homepage.css\\?ver=1.2.6" /tmp/home.html
          echo "Homepage hero mobile gap verification passed."

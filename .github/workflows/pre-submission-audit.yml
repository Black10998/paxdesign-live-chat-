name: Pre-Submission Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/pre-submission-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      APP_BUNDLE_ID: at.paxdesign.livechat
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography
      - run: python3 scripts/appstore-connect/pre_submission_audit.py

name: Deploy Apple hover underline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-hover-underline-cfc9'
    paths:
      - '.github/triggers/deploy-apple-hover-underline'
      - '.github/workflows/deploy-apple-hover-underline.yml'
      - 'navein/assets/css/apple-hover.css'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/css/apple-footer.css'
      - 'navein/assets/css/apple-app-page.css'
      - 'navein/assets/css/apple-mobile-nav.css'
      - 'navein/assets/css/apple-sticky-header.css'
      - 'navein/assets/css/mega-menu.css'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy Apple hover underline
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/.apple-hover-underline-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-hover-underline-backups/$STAMP")
             mkdir -p \"\$BACKUP/assets/css\"
             for f in style.css functions.php \
               assets/css/apple-hover.css \
               assets/css/apple-homepage.css \
               assets/css/apple-footer.css \
               assets/css/apple-app-page.css \
               assets/css/apple-mobile-nav.css \
               assets/css/apple-sticky-header.css \
               assets/css/mega-menu.css
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-hover.css \
            navein/assets/css/apple-homepage.css \
            navein/assets/css/apple-footer.css \
            navein/assets/css/apple-app-page.css \
            navein/assets/css/apple-mobile-nav.css \
            navein/assets/css/apple-sticky-header.css \
            navein/assets/css/mega-menu.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple hover underline 1.3.7"

      - name: Verify live Apple hover underline
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          set +e
          HOME_HTML=$(curl -sS -A "Mozilla/5.0" -o /tmp/home-hover.html -w '%{http_code}' \
            "https://paxdesign.at/?n=${stamp}")
          CSS=$(curl -sS -A "Mozilla/5.0" -o /tmp/apple-hover.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-hover.css?ver=1.3.7")
          STYLE=$(curl -sS -A "Mozilla/5.0" -o /tmp/style-hover.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/style.css?ver=1.3.7")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | STYLE $STYLE"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$STYLE" = "200"
          grep -Eq 'Apple-style hover interactions' /tmp/apple-hover.css
          grep -Eq 'transform: none !important' /tmp/apple-hover.css
          grep -Eq 'text-decoration: underline !important' /tmp/apple-hover.css
          grep -Eq 'scale\(1\.02\)' /tmp/apple-hover.css && exit 1 || true
          grep -Eq 'apple-hover\.css\?ver=1\.3\.7|style\.css\?ver=1\.3\.7' /tmp/home-hover.html
          grep -Eq 'Version: 1\.3\.7' /tmp/style-hover.css
          echo "Apple hover underline verification passed."

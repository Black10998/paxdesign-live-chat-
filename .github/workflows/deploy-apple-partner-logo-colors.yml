name: Deploy Apple partner logo colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-partner-logo-colors-cfc9'
    paths:
      - '.github/triggers/deploy-apple-partner-logo-colors'
      - '.github/workflows/deploy-apple-partner-logo-colors.yml'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/img/partners/**'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy Apple partner logo colors
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/img/partners") \
              $(printf '%q' "$THEME/.apple-partner-logo-colors-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-partner-logo-colors-backups/$STAMP")
             mkdir -p \"\$BACKUP/assets/css\" \"\$BACKUP/assets/img/partners\"
             for f in style.css assets/css/apple-homepage.css
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             if [ -d $(printf '%q' "$THEME/assets/img/partners") ]; then
               cp -a $(printf '%q' "$THEME/assets/img/partners") \"\$BACKUP/assets/img/\"
             fi
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-homepage.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az --delete -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/img/partners/ \
            "${REMOTE}:${THEME}/assets/img/partners/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple partner logo colors 1.4.0"

      - name: Verify live partner logo colors
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          set +e
          HOME_HTML=$(curl -sS -A "Mozilla/5.0" -o /tmp/home-logo-colors.html -w '%{http_code}' \
            "https://paxdesign.at/?n=${stamp}")
          CSS=$(curl -sS -A "Mozilla/5.0" -o /tmp/apple-homepage.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-homepage.css?ver=1.4.0")
          MS=$(curl -sS -A "Mozilla/5.0" -o /tmp/microsoft.svg -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/img/partners/microsoft.svg?n=${stamp}")
          FIGMA=$(curl -sS -A "Mozilla/5.0" -o /tmp/figma.svg -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/img/partners/figma.svg?n=${stamp}")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | MS $MS | FIGMA $FIGMA"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$MS" = "200"
          test "$FIGMA" = "200"
          grep -Eq 'filter: none' /tmp/apple-homepage.css
          grep -Eq 'brightness\(0\) invert\(1\)' /tmp/apple-homepage.css && exit 1 || true
          grep -Eq 'Official brand colors' /tmp/apple-homepage.css
          grep -Eq 'F25022|7FBA00|00A4EF|FFB900' /tmp/microsoft.svg
          grep -Eq '0acf83|a259ff|f24e1e|1abcfe' /tmp/figma.svg
          grep -Eq 'pax-sw-ribbon--partners' /tmp/home-logo-colors.html
          grep -Eq 'apple-homepage\.css\?ver=1\.4\.0|style\.css\?ver=1\.4\.0' /tmp/home-logo-colors.html
          echo "Apple partner logo colors verification passed."

name: Deploy Header Stable

# Surgical: header geometry CSS + theme enqueue + auth mount only.
# Does not rsync-delete the plugin tree. Does not copy chat PHP or build iOS.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-header-stable.yml'
      - 'navein/assets/css/apple-header-stable.css'
      - 'navein/functions.php'
      - 'navein/style.css'
      - 'paxdesign-booking/assets/customer-auth/js/pax-auth.js'
      - 'deploy-patches/restored-chat-human-ui/assets/customer-auth/js/pax-auth.js'
      - 'scripts/verify-header-stable.sh'
      - 'tests/header-stable/run.php'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Header stability guards
        run: php tests/header-stable/run.php
      - name: Header profile dropdown guards
        run: php tests/header-profile-menu/run.php
      - name: Production baseline guards
        run: php tests/production-baseline/run.php
      - name: Restored overlay guards
        run: php tests/restored-chat-human-ui/run.php
      - name: Merge-integration guards
        run: php tests/merge-integration/run.php

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy stable header
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          rsync_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if rsync -az -e "ssh ${SSH_OPTS[*]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "rsync failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "ssh failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_with_retry "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css") $(printf '%q' "$PLUGIN/assets/customer-auth/js")"

          rsync_with_retry \
            navein/assets/css/apple-header-stable.css \
            "${REMOTE}:${THEME}/assets/css/apple-header-stable.css"

          rsync_with_retry \
            navein/functions.php \
            "${REMOTE}:${THEME}/functions.php"

          rsync_with_retry \
            navein/style.css \
            "${REMOTE}:${THEME}/style.css"

          rsync_with_retry \
            paxdesign-booking/assets/customer-auth/js/pax-auth.js \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/js/pax-auth.js"

          ssh_with_retry "$REMOTE" \
            "cd '$(printf '%q' "$WP_PATH")' && \
             rm -f .maintenance && \
             (command -v wp >/dev/null && wp cache flush || true) && \
             (command -v wp >/dev/null && wp litespeed-purge all || true)"

          ssh_with_retry "$REMOTE" \
            "grep -q navein-apple-header-stable '$(printf '%q' "$THEME")/functions.php' && \
             grep -q 'dtr-search-modal-trigger' '$(printf '%q' "$THEME")/assets/css/apple-header-stable.css' && \
             grep -q 'pdx-auth-menu--apple' '$(printf '%q' "$PLUGIN")/assets/customer-auth/js/pax-auth.js' && \
             grep -q 'Version: 3.174.128' '$(printf '%q' "$PLUGIN")/assets/js/chat-script.js' && \
             echo 'OK: live stable header deployed without 3.176 chat rewrite'"

          echo "Deployed stable header (surgical rsync, no plugin tree delete, no iOS build)"

      - name: Verify live header stability
        run: |
          set -euo pipefail
          chmod +x scripts/verify-header-stable.sh
          ./scripts/verify-header-stable.sh

name: Customer Portal App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/customer-portal-appstore-build'

permissions:
  contents: read

jobs:
  customer-portal-appstore-build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64 }}
      APPLE_PROVISIONING_PROFILE_MAIN_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MAIN_BASE64 }}
      MAIN_BUNDLE_ID: at.paxdesign.customerportal
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in Xcode_26.5.app Xcode_26.app Xcode_26.0.app Xcode.app; do
            if [[ -d "/Applications/$candidate" ]]; then
              sudo xcode-select -s "/Applications/$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          xcodebuild -version

      - name: Validate Customer Portal signing secrets
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64:-}" ]]; then
            echo "ERROR: APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64 secret is missing." >&2
            echo "Create an App Store provisioning profile for at.paxdesign.customerportal and add it to GitHub Secrets." >&2
            echo "The Live Chat profile (at.paxdesign.livechat) cannot be used for the Customer Portal app." >&2
            exit 1
          fi
          for key in APPLE_TEAM_ID KEYCHAIN_PASSWORD APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD; do
            [ -n "${!key:-}" ] || { echo "Missing secret: $key" >&2; exit 1; }
          done

      - name: Build signed Customer Portal IPA
        run: |
          set +x
          cd paxdesign-booking/ios-customer-portal
          chmod +x scripts/build-appstore-ipa.sh
          ./scripts/build-appstore-ipa.sh

      - name: Upload Customer Portal IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAXCustomerPortal-AppStore-ipa
          path: paxdesign-booking/ios-customer-portal/build/AppStore/export/PAXCustomerPortal-AppStore.ipa
          if-no-files-found: error

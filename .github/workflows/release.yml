name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep "define('PAXDESIGN_BOOKING_VERSION'" paxdesign-booking/paxdesign-booking.php | sed "s/.*'\([^']*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Build WordPress plugin ZIP
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build iOS IPA
        run: |
          cd paxdesign-booking/ios-live-chat
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/paxdesign-booking-v${{ steps.version.outputs.version }}.zip
            paxdesign-booking/ios-live-chat/build/output/PAXDesignLiveChat.ipa

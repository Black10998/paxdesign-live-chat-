name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release contract
        run: |
          chmod +x scripts/validate-release-contract.sh
          ./scripts/validate-release-contract.sh "${{ github.ref_name }}"

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep "define('PAXDESIGN_BOOKING_VERSION'" paxdesign-booking/paxdesign-booking.php | sed "s/.*'\([^']*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Build WordPress plugin ZIP
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
          SHA256=$(sha256sum "dist/paxdesign-booking-v${{ steps.version.outputs.version }}.zip" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
        id: zip

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build iOS IPA
        run: |
          cd paxdesign-booking/ios-live-chat
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## WordPress plugin

            Automatic one-click update via the WordPress Dashboard (Plugins → Updates).

            **Plugin ZIP:** `paxdesign-booking-v${{ steps.version.outputs.version }}.zip`
            **SHA256:** `${{ steps.zip.outputs.sha256 }}`

            ## iOS app

            `PAXDesignLiveChat.ipa` — install via LiveContainer, AltStore, or Xcode.
          files: |
            dist/paxdesign-booking-v${{ steps.version.outputs.version }}.zip
            paxdesign-booking/ios-live-chat/build/output/PAXDesignLiveChat.ipa

name: App Store iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/ios-revolut-redesign-3a65'
    paths:
      - '.github/triggers/appstore-build'
      - 'paxdesign-booking/ios-live-chat/**'
      - '.github/workflows/release-appstore.yml'

permissions:
  contents: read

concurrency:
  group: appstore-build
  cancel-in-progress: true

jobs:
  appstore-build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_MAIN_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MAIN_BASE64 }}
      APPLE_PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      MAIN_BUNDLE_ID: at.paxdesign.livechat
      WIDGET_BUNDLE_ID: at.paxdesign.livechat.widgets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 SDK
        run: |
          set -euo pipefail
          for candidate in Xcode_26.5.app Xcode_26.app Xcode_26.0.app; do
            if [[ -d "/Applications/$candidate" ]]; then
              sudo xcode-select -s "/Applications/$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "ERROR: Xcode 26 not found on runner" >&2
          ls -1 /Applications/Xcode*.app || true
          exit 1

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography

      - name: Validate App Store Connect private key
        run: python3 scripts/appstore-connect/prepare-asc-key.py

      - name: Refresh Live Chat App Store provisioning profile
        run: python3 scripts/appstore-connect/prepare_livechat_provisioning_profile.py

      - name: Build signed App Store IPA
        shell: bash
        run: |
          set +x
          cd paxdesign-booking/ios-live-chat
          chmod +x scripts/build-appstore-ipa.sh \
            scripts/validate-appstore-archive.sh \
            scripts/validate-appstore-ipa.sh
          for attempt in 1 2 3; do
            echo "==> App Store archive attempt $attempt/3"
            if ./scripts/build-appstore-ipa.sh; then
              exit 0
            fi
            echo "WARN: App Store build attempt $attempt failed; cleaning DerivedData before retry." >&2
            rm -rf build/AppStore/DerivedData build/AppStore/PAXDesignLiveChat.xcarchive
            sleep $((attempt * 20))
          done
          echo "ERROR: App Store build failed after 3 attempts." >&2
          exit 1

      - name: Upload App Store IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAXDesignLiveChat-AppStore-ipa
          path: paxdesign-booking/ios-live-chat/build/AppStore/export/PAXDesignLiveChat-AppStore.ipa
          if-no-files-found: error

      - name: Upload ExportOptions.plist artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAXDesignLiveChat-AppStore-export-options
          path: paxdesign-booking/ios-live-chat/build/AppStore/ExportOptions.plist
          if-no-files-found: error

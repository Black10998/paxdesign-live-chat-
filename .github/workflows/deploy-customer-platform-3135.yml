name: Deploy customer platform 3.153.0

on:
  workflow_dispatch:
    inputs:
      skip_backup:
        description: Skip remote backup (not recommended)
        required: false
        default: "false"
      production:
        description: Deploy to production after verification
        required: false
        default: "true"
  push:
    branches:
      - main
    paths:
      - 'paxdesign-booking/**'
      - '.github/triggers/deploy-customer-platform-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP extensions
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql ripgrep

      - name: PHP syntax validation
        run: |
          set -euo pipefail
          rg --files -g '*.php' paxdesign-booking/includes/customer paxdesign-booking/includes/auth | xargs -n1 php -l
          php -l paxdesign-booking/includes/class-paxdesign-chat.php

      - name: Customer platform static tests
        run: php tests/customer-platform/run.php

      - name: Messaging reliability tests
        run: |
          sudo apt-get install -y mariadb-client
          docker run -d --name pax-messaging-db -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 -e MARIADB_DATABASE=pax_chat_test -p 3306:3306 mariadb:11
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 --silent && break
            sleep 2
          done
          PAX_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=pax_chat_test;charset=utf8mb4' php tests/messaging/run.php

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing secret: $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Remote backup (database + wp-content)
        if: inputs.skip_backup != 'true'
        continue-on-error: true
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod +x scripts/backup-wp-production.sh
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "WP_PATH=$(printf '%q' "$WP_PATH") bash -s" < scripts/backup-wp-production.sh | tee backup.log

      - name: Deploy paxdesign-booking (toolbar-independent)
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          BOOKING_TARGET="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          rsync -az --delete -e "ssh ${SSH_OPTS[*]}" paxdesign-booking/ "${WP_SSH_USER}@${WP_SSH_HOST}:${BOOKING_TARGET}/"
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp plugin deactivate paxdesign-toolbar --quiet 2>/dev/null || true) && (command -v wp >/dev/null && wp plugin activate paxdesign-booking && wp cache flush || true)"

      - name: Run customer database migrations
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-customer-db-migrate.php || echo 'wp-cli unavailable — migrations run on next request')"

      - name: Ensure /account authentication page
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-ensure-auth-page.php || echo 'wp-cli unavailable — account page runs on next request')"

      - name: Configure Sign in with Apple web OAuth
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
          PAX_APPLE_WEB_SERVICE_ID: at.paxdesign.web.login
          PAX_APPLE_WEB_KEY_ID: ${{ secrets.PAX_APPLE_WEB_KEY_ID }}
          PAX_APPLE_WEB_KEY_P8_BASE64: ${{ secrets.PAX_APPLE_WEB_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          if [ -n "${PAX_APPLE_WEB_KEY_P8_BASE64:-}" ]; then
            python3 scripts/prepare-apple-web-oauth-key.py > /tmp/apple-web-oauth-key.pem
            scp "${SSH_OPTS[@]}" /tmp/apple-web-oauth-key.pem "${WP_SSH_USER}@${WP_SSH_HOST}:${WP_PATH%/}/apple-web-oauth-key.pem"
          fi
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && \
             export PAX_APPLE_WEB_SERVICE_ID=$(printf '%q' "${PAX_APPLE_WEB_SERVICE_ID:-at.paxdesign.web.login}") && \
             export PAX_APPLE_WEB_KEY_ID=$(printf '%q' "${PAX_APPLE_WEB_KEY_ID:-}") && \
             if [ -f apple-web-oauth-key.pem ]; then export PAX_APPLE_WEB_KEY_P8=\$(cat apple-web-oauth-key.pem); fi && \
             wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-web-oauth-config.php && \
             rm -f apple-web-oauth-key.pem"

      - name: Diagnose Apple OAuth client secret
        continue-on-error: true
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-oauth-diagnose.php || echo 'wp-cli unavailable')"

      - name: Dump Apple OAuth production trace
        continue-on-error: true
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-oauth-trace.php || echo 'wp-cli unavailable')"

      - name: Smoke test Apple finish URL on account page
        continue-on-error: true
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          FINISH_URL="$(ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-oauth-smoke-finish.php" | rg '^finish_url=' | cut -d= -f2-)"
          echo "Generated finish URL: $FINISH_URL"
          curl -sI "$FINISH_URL" | tee smoke-finish-headers.txt
          rg -i "^HTTP|^location|^set-cookie" smoke-finish-headers.txt

      - name: Fix Hostinger REST Authorization passthrough
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod +x scripts/fix-hostinger-wp-access.sh
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "WP_PATH=$(printf '%q' "$WP_PATH") bash -s" < scripts/fix-hostinger-wp-access.sh

      - name: Ensure Live Chat admin REST access
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
          PAX_ADMIN_USER: ${{ secrets.PAX_ADMIN_USER }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && export PAX_ADMIN_USER=$(printf '%q' "${PAX_ADMIN_USER:-}") && (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-ensure-live-admin-access.php || echo 'wp-cli unavailable — staff access runs on next deploy')"

      - name: Disable WordPress debug logging on production
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod +x scripts/configure-wp-production-debug.sh
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "WP_PATH=$(printf '%q' "$WP_PATH") bash -s" < scripts/configure-wp-production-debug.sh

      - name: Post-deploy customer platform verification
        env:
          PAX_SITE: https://paxdesign.at
          PAX_EXPECTED_BOOKING: "3.173.8"
          PAX_ADMIN_USER: ${{ secrets.PAX_ADMIN_USER }}
          PAX_ADMIN_APP_PASSWORD: ${{ secrets.PAX_ADMIN_APP_PASSWORD }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-customer-platform-3166.sh scripts/verify-debug-log-post-deploy.sh
          ./scripts/verify-customer-platform-3166.sh | tee verify-customer-platform.log
          ./scripts/verify-debug-log-post-deploy.sh | tee verify-debug-log.log || true

      - name: Verify production AI stream (fresh ai handler session)
        env:
          PAX_SITE: https://paxdesign.at
          PAX_ADMIN_USER: ${{ secrets.PAX_ADMIN_USER }}
          PAX_ADMIN_APP_PASSWORD: ${{ secrets.PAX_ADMIN_APP_PASSWORD }}
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-customer-ai-stream-production.sh
          ./scripts/verify-customer-ai-stream-production.sh | tee verify-customer-ai-stream.log

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-platform-deploy-3135
          path: |
            backup.log
            verify-customer-platform.log
            verify-customer-ai-stream.log

name: Deploy Apple Desktop Mega Nav

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-desktop-mega-nav-cfc9'
    paths:
      - '.github/triggers/deploy-apple-desktop-mega-nav'
      - '.github/workflows/deploy-apple-desktop-mega-nav.yml'
      - 'navein/assets/css/mega-menu.css'
      - 'navein/assets/js/mega-menu.js'
      - 'navein/assets/css/apple-sticky-header.css'
      - 'navein/assets/css/apple-mobile-nav.css'
      - 'navein/assets/js/apple-mobile-nav.js'
      - 'navein/includes/class-navein-mega-menu-walker.php'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy premium desktop mega menu + header
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/includes") \
              $(printf '%q' "$THEME/.apple-desktop-mega-nav-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-desktop-mega-nav-backups/$STAMP")
             mkdir -p \"\$BACKUP\"
             for f in \
               functions.php \
               style.css \
               assets/css/mega-menu.css \
               assets/js/mega-menu.js \
               assets/css/apple-sticky-header.css \
               assets/css/apple-mobile-nav.css \
               assets/js/apple-mobile-nav.js \
               includes/class-navein-mega-menu-walker.php
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/mega-menu.css \
            navein/assets/css/apple-sticky-header.css \
            navein/assets/css/apple-mobile-nav.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/mega-menu.js \
            navein/assets/js/apple-mobile-nav.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/includes/class-navein-mega-menu-walker.php \
            "${REMOTE}:${THEME}/includes/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple desktop mega nav 1.1.4"

      - name: Verify live desktop mega nav
        run: |
          set -euo pipefail
          set +e
          HOME_HTML=$(curl -sS -o /tmp/home-mega.html -w '%{http_code}' "https://paxdesign.at/?n=$(date +%s)")
          CSS=$(curl -sS -o /tmp/mega-menu.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/mega-menu.css?ver=1.1.4")
          JS=$(curl -sS -o /tmp/mega-menu.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/js/mega-menu.js?ver=1.1.4")
          STICKY=$(curl -sS -o /tmp/apple-sticky-header.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-sticky-header.css?ver=1.1.4")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | JS $JS | STICKY $STICKY"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$JS" = "200"
          test "$STICKY" = "200"
          grep -Eq "dtr-mega-feature|dtr-mega-panel--premium|dtr-has-mega" /tmp/home-mega.html
          grep -Eq "folio-item-img6|Product-Card-Mockup|dtr-mega-feature__media" /tmp/home-mega.html
          grep -Eq "dtr-mega-feature|panel-bg: #ffffff|--dtr-mega-panel-bg: #fff" /tmp/mega-menu.css
          grep -Eq "dtr-mega-open|clampPanel" /tmp/mega-menu.js
          grep -Eq "255, 255, 255|rgba\(255, 255, 255" /tmp/apple-sticky-header.css
          grep -Eq "style.css\?ver=1.1.4|mega-menu.css\?ver=1.1.4" /tmp/home-mega.html
          echo "Apple desktop mega nav verification passed."

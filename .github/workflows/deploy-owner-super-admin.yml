name: Deploy Owner Super Admin

# Surgical: promote sarah.gta1995@gmail.com to WordPress administrator with
# full wp-admin access AND full owner/master-admin access to the customer portal.
# Does not rsync-delete the plugin tree. Does not copy 3.176 chat rewrite or build iOS.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-owner-super-admin.yml'
      - 'paxdesign-booking/includes/auth/class-paxdesign-auth-native.php'
      - 'paxdesign-booking/includes/auth/class-paxdesign-customers.php'
      - 'paxdesign-booking/includes/auth/class-paxdesign-auth-apple.php'
      - 'paxdesign-booking/includes/auth/class-paxdesign-auth-github.php'
      - 'paxdesign-booking/includes/customer/class-paxdesign-customer-master-admin.php'
      - 'paxdesign-booking/includes/customer/class-paxdesign-customer-registry.php'
      - 'paxdesign-booking/includes/customer/class-paxdesign-customer-auth.php'
      - 'paxdesign-booking/includes/customer/data/account-ui-l10n.php'
      - 'paxdesign-booking/includes/customer/data/account-ui-l10n-tr.php'
      - 'paxdesign-booking/assets/customer-auth/js/pax-auth.js'
      - 'paxdesign-booking/scripts/wp-eval-ensure-live-admin-access.php'
      - 'deploy-patches/restored-chat-human-ui/assets/customer-auth/js/pax-auth.js'
      - 'deploy-patches/restored-chat-human-ui/includes/auth/class-paxdesign-auth-github.php'
      - 'tests/owner-super-admin/run.php'
      - 'tests/customer-platform/run.php'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Owner super-admin guards
        run: php tests/owner-super-admin/run.php
      - name: Customer platform guards
        run: php tests/customer-platform/run.php
      - name: Production baseline guards
        run: php tests/production-baseline/run.php
      - name: Restored overlay guards
        run: php tests/restored-chat-human-ui/run.php
      - name: Merge-integration guards
        run: php tests/merge-integration/run.php
      - name: CCS baseline guards
        run: php tests/ccs-ai/run.php

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy owner super-admin surgically
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          rsync_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if rsync -az -e "ssh ${SSH_OPTS[*]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "rsync failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "ssh failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_with_retry "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$PLUGIN/includes/auth") \
              $(printf '%q' "$PLUGIN/includes/customer") \
              $(printf '%q' "$PLUGIN/includes/customer/data") \
              $(printf '%q' "$PLUGIN/assets/customer-auth/js") \
              $(printf '%q' "$PLUGIN/scripts")"

          rsync_with_retry paxdesign-booking/includes/auth/class-paxdesign-auth-native.php "${REMOTE}:${PLUGIN}/includes/auth/class-paxdesign-auth-native.php"
          rsync_with_retry paxdesign-booking/includes/auth/class-paxdesign-customers.php "${REMOTE}:${PLUGIN}/includes/auth/class-paxdesign-customers.php"
          rsync_with_retry paxdesign-booking/includes/auth/class-paxdesign-auth-apple.php "${REMOTE}:${PLUGIN}/includes/auth/class-paxdesign-auth-apple.php"
          rsync_with_retry paxdesign-booking/includes/auth/class-paxdesign-auth-github.php "${REMOTE}:${PLUGIN}/includes/auth/class-paxdesign-auth-github.php"
          rsync_with_retry paxdesign-booking/includes/customer/class-paxdesign-customer-master-admin.php "${REMOTE}:${PLUGIN}/includes/customer/class-paxdesign-customer-master-admin.php"
          rsync_with_retry paxdesign-booking/includes/customer/class-paxdesign-customer-registry.php "${REMOTE}:${PLUGIN}/includes/customer/class-paxdesign-customer-registry.php"
          rsync_with_retry paxdesign-booking/includes/customer/class-paxdesign-customer-auth.php "${REMOTE}:${PLUGIN}/includes/customer/class-paxdesign-customer-auth.php"
          rsync_with_retry paxdesign-booking/includes/customer/data/account-ui-l10n.php "${REMOTE}:${PLUGIN}/includes/customer/data/account-ui-l10n.php"
          rsync_with_retry paxdesign-booking/includes/customer/data/account-ui-l10n-tr.php "${REMOTE}:${PLUGIN}/includes/customer/data/account-ui-l10n-tr.php"
          rsync_with_retry paxdesign-booking/assets/customer-auth/js/pax-auth.js "${REMOTE}:${PLUGIN}/assets/customer-auth/js/pax-auth.js"
          rsync_with_retry paxdesign-booking/scripts/wp-eval-ensure-live-admin-access.php "${REMOTE}:${PLUGIN}/scripts/wp-eval-ensure-live-admin-access.php"

          ssh_with_retry "$REMOTE" \
            "cd '$(printf '%q' "$WP_PATH")' && \
             rm -f .maintenance && \
             (command -v wp >/dev/null && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-ensure-live-admin-access.php || echo 'wp-cli unavailable — owner promotion runs on next login') && \
             (command -v wp >/dev/null && wp cache flush || true) && \
             (command -v wp >/dev/null && wp litespeed-purge all || true)"

          ssh_with_retry "$REMOTE" \
            "grep -q 'sarah.gta1995@gmail.com' '$(printf '%q' "$PLUGIN")/includes/auth/class-paxdesign-auth-native.php' && \
             grep -q 'provision_owner_administrator' '$(printf '%q' "$PLUGIN")/includes/auth/class-paxdesign-auth-native.php' && \
             grep -q 'owner_can_use_customer_portal' '$(printf '%q' "$PLUGIN")/includes/auth/class-paxdesign-auth-native.php' && \
             grep -q 'OWNER_EMAIL' '$(printf '%q' "$PLUGIN")/includes/customer/class-paxdesign-customer-master-admin.php' && \
             grep -q 'user.is_owner' '$(printf '%q' "$PLUGIN")/assets/customer-auth/js/pax-auth.js' && \
             grep -q 'nav_wordpress_admin' '$(printf '%q' "$PLUGIN")/assets/customer-auth/js/pax-auth.js' && \
             grep -q 'Version: 3.174.128' '$(printf '%q' "$PLUGIN")/assets/js/chat-script.js' && \
             ! grep -q 'skipping stacked sync' '$(printf '%q' "$PLUGIN")/assets/js/chat-script.js' && \
             echo 'OK: live owner super-admin deployed without 3.176 chat rewrite'"

          echo "Deployed owner super-admin (surgical rsync, no plugin tree delete, no iOS build)"

name: Deploy Apple Footer Redesign

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-footer-redesign-cfc9'
    paths:
      - '.github/triggers/deploy-apple-footer'
      - '.github/workflows/deploy-apple-footer.yml'
      - 'navein/assets/css/apple-footer.css'
      - 'navein/assets/js/apple-footer.js'
      - 'navein/footer.php'
      - 'navein/template-parts/footer/apple-footer.php'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy Apple footer redesign
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/template-parts/footer") \
              $(printf '%q' "$THEME/.apple-footer-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-footer-backups/$STAMP")
             mkdir -p \"\$BACKUP\"
             for f in \
               style.css \
               functions.php \
               footer.php \
               assets/css/apple-footer.css \
               assets/js/apple-footer.js \
               template-parts/footer/apple-footer.php
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-footer.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-footer.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/footer/apple-footer.php \
            "${REMOTE}:${THEME}/template-parts/footer/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/footer.php \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple footer redesign 1.2.0"

      - name: Verify live Apple footer
        run: |
          set -euo pipefail
          set +e
          HOME_HTML=$(curl -sS -o /tmp/home-af.html -w '%{http_code}' "https://paxdesign.at/?n=$(date +%s)")
          SOFT_HTML=$(curl -sS -o /tmp/soft-af.html -w '%{http_code}' "https://paxdesign.at/softwareentwicklung/?n=$(date +%s)")
          CSS=$(curl -sS -o /tmp/apple-footer.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-footer.css?ver=1.2.0")
          JS=$(curl -sS -o /tmp/apple-footer.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-footer.js?ver=1.2.0")
          set -e
          echo "HOME $HOME_HTML | SOFT $SOFT_HTML | CSS $CSS | JS $JS"
          test "$HOME_HTML" = "200"
          test "$SOFT_HTML" = "200"
          test "$CSS" = "200"
          test "$JS" = "200"
          grep -Eq "apple-footer.css\?ver=1.2.0|style.css\?ver=1.2.0" /tmp/home-af.html
          grep -Eq "dtr-apple-footer|navein-apple-footer|pax-af" /tmp/home-af.html
          grep -Eq "pax-af__directory|pax-af__newsletter|PAXdesign|paxmc-footer-subscribe" /tmp/home-af.html
          ! grep -Eq "PrimoJob|pj-logo-text" /tmp/home-af.html
          grep -Eq "pax-af__directory|af-snow|#f5f5f7" /tmp/apple-footer.css
          grep -Eq "initGithubModal|data-pax-af|dtr-apple-footer" /tmp/apple-footer.js
          grep -Eq "pax-af" /tmp/soft-af.html
          echo "Apple footer verification passed."

name: Deploy Apple Cybercrime Support page

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/cybercrime-support-page-bdff'
      - 'cursor/cybercrime-support-fixes-db83'
    paths:
      - '.github/triggers/deploy-apple-cybercrime-support'
      - '.github/workflows/deploy-apple-cybercrime-support.yml'
      - 'navein/template-apple-cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support-data.php'
      - 'navein/template-parts/page-title/page-header-page.php'
      - 'navein/assets/css/apple-app-page.css'
      - 'navein/assets/css/apple-cybercrime-support.css'
      - 'navein/assets/js/apple-app-page.js'
      - 'navein/assets/js/apple-cybercrime-support.js'
      - 'navein/functions.php'
      - 'navein/style.css'
      - 'paxdesign-booking/includes/class-paxdesign-chat.php'
      - 'paxdesign-booking/includes/class-paxdesign-chat-knowledge.php'
      - 'paxdesign-booking/assets/js/chat-script.js'
      - 'paxdesign-booking/assets/js/booking-script.js'
      - 'paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php'
      - 'paxdesign-booking/assets/customer-auth/css/pdx-auth.css'
      - 'paxdesign-booking/assets/customer-auth/css/pdx-portal-apple.css'
      - 'paxdesign-booking/includes/auth/class-paxdesign-auth-frontend.php'
      - 'paxdesign-booking/assets/customer-auth/js/pax-auth.js'
      - 'paxdesign-booking/paxdesign-booking.php'
      - 'scripts/assign-apple-cybercrime-support-template.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy theme, plugin context, and assign page template
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry_ssh() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              echo "SSH/rsync attempt ${attempt} failed; retrying in $((attempt * 4))s..." >&2
              sleep $((attempt * 4))
            done
            return 1
          }

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/template-parts/pages") \
              $(printf '%q' "$THEME/template-parts/page-title") \
              $(printf '%q' "$THEME/scripts") \
              $(printf '%q' "$PLUGIN/includes") \
              $(printf '%q' "$PLUGIN/includes/auth") \
              $(printf '%q' "$PLUGIN/assets/js") \
              $(printf '%q' "$PLUGIN/assets/customer-auth/css") \
              $(printf '%q' "$PLUGIN/assets/customer-auth/js")"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-cybercrime-support.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-cybercrime-support.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-apple-cybercrime-support.php \
            "${REMOTE}:${THEME}/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/pages/cybercrime-support.php \
            navein/template-parts/pages/cybercrime-support-data.php \
            "${REMOTE}:${THEME}/template-parts/pages/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/page-title/page-header-page.php \
            "${REMOTE}:${THEME}/template-parts/page-title/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            scripts/assign-apple-cybercrime-support-template.sh \
            "${REMOTE}:${THEME}/scripts/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/class-paxdesign-chat.php \
            paxdesign-booking/includes/class-paxdesign-chat-knowledge.php \
            paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php \
            "${REMOTE}:${PLUGIN}/includes/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/auth/class-paxdesign-auth-frontend.php \
            "${REMOTE}:${PLUGIN}/includes/auth/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/js/chat-script.js \
            paxdesign-booking/assets/js/booking-script.js \
            "${REMOTE}:${PLUGIN}/assets/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/customer-auth/css/pdx-auth.css \
            paxdesign-booking/assets/customer-auth/css/pdx-portal-apple.css \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/css/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/customer-auth/js/pax-auth.js \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/paxdesign-booking.php \
            "${REMOTE}:${PLUGIN}/"

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "chmod +x $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh") && \
             WP_PATH=$(printf '%q' "$WP_PATH") bash $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh")"

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple Cybercrime Support page + auth + plugin updates"

      - name: Verify live page
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          PAGE=$(curl -sS -o /tmp/ccs-page.html -w '%{http_code}' "https://paxdesign.at/cybercrime-support/?n=${stamp}")
          THEME_CSS=$(curl -sS -o /tmp/style.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/style.css?n=${stamp}")
          CCS_CSS=$(curl -sS -o /tmp/apple-ccs.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-cybercrime-support.css?n=${stamp}")
          CCS_JS=$(curl -sS -o /tmp/apple-ccs.js -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-cybercrime-support.js?n=${stamp}")
          PLUGIN=$(curl -sS -o /tmp/pax-plugin.php -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/paxdesign-booking.php?n=${stamp}")
          BOOKING_JS=$(curl -sS -o /tmp/booking-script.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/booking-script.js?n=${stamp}")
          AUTH_CSS=$(curl -sS -o /tmp/pdx-auth.css -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/customer-auth/css/pdx-auth.css?n=${stamp}")
          CHAT=$(curl -sS -o /tmp/chat-script.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/chat-script.js?n=${stamp}")
          echo "PAGE $PAGE | THEME_CSS $THEME_CSS | CCS_CSS $CCS_CSS | CCS_JS $CCS_JS | PLUGIN $PLUGIN | BOOKING_JS $BOOKING_JS | AUTH_CSS $AUTH_CSS | CHAT $CHAT"
          test "$PAGE" = "200"
          test "$THEME_CSS" = "200"
          test "$CCS_CSS" = "200"
          test "$CCS_JS" = "200"
          test "$AUTH_CSS" = "200"
          test "$CHAT" = "200"
          grep -Eq "Version: 1\.4\.11" /tmp/style.css
          grep -Eq "pax-ccs-portal|pax-ccs-intake-form|pax-ccs-login-gate" /tmp/ccs-page.html
          grep -Eq "Full-page contrast isolation|::file-selector-button" /tmp/apple-ccs.css
          grep -Eq "Sitewide isolated Sign In|background: #000 !important" /tmp/pdx-auth.css
          grep -Eq "openForCybercrime|openSupportChat" /tmp/apple-ccs.js
          grep -Eq "page_reference|openForCybercrime" /tmp/chat-script.js
          grep -Eq "chat-script\.js\?ver=3\.174\.41|pdx-auth\.css\?ver=3\.174\.41" /tmp/ccs-page.html
          grep -A6 '#pdx-auth-bar.pdx-auth-bar--header .pdx-auth-signup-btn {' /tmp/pdx-auth.css | grep -Eq 'background: #000|background-color: #000'
          if [ "$PLUGIN" = "200" ]; then grep -Eq "3\.174\.41" /tmp/pax-plugin.php; fi
          if [ "$BOOKING_JS" = "200" ]; then grep -Eq 'open: openWidget' /tmp/booking-script.js; fi
          echo "Cybercrime Support production verification passed."

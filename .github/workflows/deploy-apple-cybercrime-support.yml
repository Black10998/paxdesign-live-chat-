name: Deploy Apple Cybercrime Support page

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/cybercrime-support-page-bdff'
    paths:
      - '.github/triggers/deploy-apple-cybercrime-support'
      - '.github/workflows/deploy-apple-cybercrime-support.yml'
      - 'navein/template-apple-cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support-data.php'
      - 'navein/template-parts/page-title/page-header-page.php'
      - 'navein/assets/css/apple-app-page.css'
      - 'navein/assets/css/apple-cybercrime-support.css'
      - 'navein/assets/js/apple-app-page.js'
      - 'navein/assets/js/apple-cybercrime-support.js'
      - 'navein/functions.php'
      - 'navein/style.css'
      - 'paxdesign-booking/includes/class-paxdesign-chat.php'
      - 'paxdesign-booking/includes/class-paxdesign-chat-knowledge.php'
      - 'paxdesign-booking/assets/js/chat-script.js'
      - 'paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php'
      - 'paxdesign-booking/paxdesign-booking.php'
      - 'scripts/assign-apple-cybercrime-support-template.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy theme, plugin context, and assign page template
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/template-parts/pages") \
              $(printf '%q' "$THEME/template-parts/page-title") \
              $(printf '%q' "$THEME/scripts") \
              $(printf '%q' "$PLUGIN/includes") \
              $(printf '%q' "$PLUGIN/assets/js")"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-cybercrime-support.css \
            "${REMOTE}:${THEME}/assets/css/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-cybercrime-support.js \
            "${REMOTE}:${THEME}/assets/js/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-apple-cybercrime-support.php \
            "${REMOTE}:${THEME}/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/pages/cybercrime-support.php \
            navein/template-parts/pages/cybercrime-support-data.php \
            "${REMOTE}:${THEME}/template-parts/pages/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/page-title/page-header-page.php \
            "${REMOTE}:${THEME}/template-parts/page-title/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            scripts/assign-apple-cybercrime-support-template.sh \
            "${REMOTE}:${THEME}/scripts/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/class-paxdesign-chat.php \
            paxdesign-booking/includes/class-paxdesign-chat-knowledge.php \
            paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php \
            "${REMOTE}:${PLUGIN}/includes/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/js/chat-script.js \
            "${REMOTE}:${PLUGIN}/assets/js/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/paxdesign-booking.php \
            "${REMOTE}:${PLUGIN}/"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "chmod +x $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh") && \
             WP_PATH=$(printf '%q' "$WP_PATH") bash $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh")"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple Cybercrime Support page + Live Chat context"

      - name: Verify live page
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          PAGE=$(curl -sS -o /tmp/ccs-page.html -w '%{http_code}' "https://paxdesign.at/cybercrime-support/?n=${stamp}")
          CSS=$(curl -sS -o /tmp/apple-ccs.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-cybercrime-support.css?ver=1.4.6&n=${stamp}")
          JS=$(curl -sS -o /tmp/apple-ccs.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-cybercrime-support.js?ver=1.4.6&n=${stamp}")
          CHAT=$(curl -sS -o /tmp/chat-script.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/chat-script.js?ver=3.173.12&n=${stamp}")
          echo "PAGE $PAGE | CSS $CSS | JS $JS | CHAT $CHAT"
          test "$PAGE" = "200"
          test "$CSS" = "200"
          test "$JS" = "200"
          test "$CHAT" = "200"
          grep -Eq "pax-ccs-portal|pax-ccs-intake-form|Cybercrime-Meldung|تقرير جريمة" /tmp/ccs-page.html
          grep -Eq "page-template-template-apple-cybercrime-support|navein-apple-cybercrime-support" /tmp/ccs-page.html
          grep -Eq "pax-ccs-portal__progress|renderReview|paxCybercrimeIntake" /tmp/apple-ccs.js
          grep -Eq "page_context|cybercrime-support" /tmp/chat-script.js
          grep -Eq "pax-ccs-shield|pax-aap-hero" /tmp/ccs-page.html && { echo "Old marketing layout still present" >&2; exit 1; } || true
          echo "Apple Cybercrime Support portal verification passed."

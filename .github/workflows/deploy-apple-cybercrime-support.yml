name: Deploy Apple Cybercrime Support page

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/cybercrime-support-page-bdff'
      - 'cursor/cybercrime-support-fixes-db83'
      - 'cursor/cybercrime-ticket-workflow-db83'
      - 'cursor/cybercrime-admin-reply-hotfix-3a65'
      - 'cursor/cybercrime-disclaimer-mobile-3a65'
    paths:
      - '.github/triggers/deploy-apple-cybercrime-support'
      - '.github/workflows/deploy-apple-cybercrime-support.yml'
      - 'navein/template-apple-cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support-data.php'
      - 'navein/template-parts/pages/cybercrime-support-en.php'
      - 'navein/template-parts/page-title/page-header-page.php'
      - 'navein/assets/css/apple-app-page.css'
      - 'navein/assets/css/apple-cybercrime-support.css'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/js/apple-app-page.js'
      - 'navein/assets/js/apple-cybercrime-support.js'
      - 'navein/inc/cybercrime-countries.php'
      - 'navein/inc/cybercrime-support-locale.php'
      - 'navein/style.css'
      - 'navein/screenshot.png'
      - 'navein/fonts/iconfont.css'
      - 'paxdesign-booking/includes/class-paxdesign-chat.php'
      - 'paxdesign-booking/includes/class-paxdesign-chat-knowledge.php'
      - 'paxdesign-booking/assets/js/chat-script.js'
      - 'paxdesign-booking/assets/js/booking-script.js'
      - 'paxdesign-booking/assets/js/cybercrime-admin.js'
      - 'paxdesign-booking/assets/js/cybercrime-admin-notifications.js'
      - 'paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php'
      - 'paxdesign-booking/includes/class-paxdesign-cybercrime-tickets.php'
      - 'paxdesign-booking/includes/class-paxdesign-link-scan-service.php'
      - 'paxdesign-booking/includes/class-paxdesign-widget-performance.php'
      - '.gitignore'
      - 'paxdesign-booking/includes/customer/class-paxdesign-customer-admin.php'
      - 'paxdesign-booking/assets/customer-auth/css/pdx-auth.css'
      - 'paxdesign-booking/assets/customer-auth/css/pdx-portal-apple.css'
      - 'paxdesign-booking/includes/auth/class-paxdesign-auth-frontend.php'
      - 'paxdesign-booking/assets/customer-auth/js/pax-auth.js'
      - 'paxdesign-booking/paxdesign-booking.php'
      - 'scripts/assign-apple-cybercrime-support-template.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy theme, plugin context, and assign page template
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry_ssh() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              echo "SSH/rsync attempt ${attempt} failed; retrying in $((attempt * 4))s..." >&2
              sleep $((attempt * 4))
            done
            return 1
          }

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/inc") \
              $(printf '%q' "$THEME/fonts") \
              $(printf '%q' "$THEME/template-parts/pages") \
              $(printf '%q' "$THEME/template-parts/page-title") \
              $(printf '%q' "$THEME/scripts") \
              $(printf '%q' "$PLUGIN/includes") \
              $(printf '%q' "$PLUGIN/includes/auth") \
              $(printf '%q' "$PLUGIN/assets/js") \
              $(printf '%q' "$PLUGIN/assets/customer-auth/css") \
              $(printf '%q' "$PLUGIN/assets/customer-auth/js")"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-cybercrime-support.css \
            navein/assets/css/apple-homepage.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-cybercrime-support.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-apple-cybercrime-support.php \
            "${REMOTE}:${THEME}/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/pages/cybercrime-support.php \
            navein/template-parts/pages/cybercrime-support-data.php \
            navein/template-parts/pages/cybercrime-support-en.php \
            "${REMOTE}:${THEME}/template-parts/pages/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/page-title/page-header-page.php \
            "${REMOTE}:${THEME}/template-parts/page-title/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/inc/cybercrime-countries.php \
            navein/inc/cybercrime-support-locale.php \
            navein/inc/performance.php \
            "${REMOTE}:${THEME}/inc/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            navein/screenshot.png \
            "${REMOTE}:${THEME}/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/fonts/iconfont.css \
            "${REMOTE}:${THEME}/fonts/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            scripts/assign-apple-cybercrime-support-template.sh \
            "${REMOTE}:${THEME}/scripts/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/class-paxdesign-chat.php \
            paxdesign-booking/includes/class-paxdesign-chat-knowledge.php \
            paxdesign-booking/includes/class-paxdesign-cybercrime-intake.php \
            paxdesign-booking/includes/class-paxdesign-cybercrime-tickets.php \
            paxdesign-booking/includes/class-paxdesign-chat-live.php \
            paxdesign-booking/includes/class-paxdesign-link-scan-service.php \
            paxdesign-booking/includes/class-paxdesign-widget-performance.php \
            "${REMOTE}:${PLUGIN}/includes/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/customer/class-paxdesign-customer-admin.php \
            "${REMOTE}:${PLUGIN}/includes/customer/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/includes/auth/class-paxdesign-auth-frontend.php \
            "${REMOTE}:${PLUGIN}/includes/auth/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/js/chat-script.js \
            paxdesign-booking/assets/js/booking-script.js \
            paxdesign-booking/assets/js/widget-loader.js \
            paxdesign-booking/assets/js/cybercrime-admin.js \
            paxdesign-booking/assets/js/cybercrime-admin-notifications.js \
            "${REMOTE}:${PLUGIN}/assets/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/customer-auth/css/pdx-auth.css \
            paxdesign-booking/assets/customer-auth/css/pdx-portal-apple.css \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/css/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/assets/customer-auth/js/pax-auth.js \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/js/"

          retry_ssh rsync -az -e "ssh ${SSH_OPTS[*]}" \
            paxdesign-booking/paxdesign-booking.php \
            "${REMOTE}:${PLUGIN}/"

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "chmod +x $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh") && \
             WP_PATH=$(printf '%q' "$WP_PATH") bash $(printf '%q' "$THEME/scripts/assign-apple-cybercrime-support-template.sh")"

          retry_ssh ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple Cybercrime Support page + auth + plugin updates"

      - name: Verify live page
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          PAGE=$(curl -sS -o /tmp/ccs-page.html -w '%{http_code}' "https://paxdesign.at/cybercrime-support/?n=${stamp}")
          THEME_CSS=$(curl -sS -o /tmp/style.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/style.css?n=${stamp}")
          CCS_CSS=$(curl -sS -o /tmp/apple-ccs.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-cybercrime-support.css?n=${stamp}")
          CCS_JS=$(curl -sS -o /tmp/apple-ccs.js -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-cybercrime-support.js?n=${stamp}")
          ADMIN_JS=$(curl -sS -o /tmp/cybercrime-admin.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/cybercrime-admin.js?n=${stamp}")
          ADMIN_NOTIFY_JS=$(curl -sS -o /tmp/cybercrime-admin-notifications.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/cybercrime-admin-notifications.js?n=${stamp}")
          PLUGIN=$(curl -sS -o /tmp/pax-plugin.php -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/paxdesign-booking.php?n=${stamp}")
          BOOKING_JS=$(curl -sS -o /tmp/booking-script.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/booking-script.js?n=${stamp}")
          AUTH_CSS=$(curl -sS -o /tmp/pdx-auth.css -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/customer-auth/css/pdx-auth.css?n=${stamp}")
          CHAT=$(curl -sS -o /tmp/chat-script.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/chat-script.js?n=${stamp}")
          AUTH_JS=$(curl -sS -o /tmp/pax-auth.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/customer-auth/js/pax-auth.js?n=${stamp}")
          WIDGET_LOADER=$(curl -sS -o /tmp/widget-loader.js -w '%{http_code}' "https://paxdesign.at/wp-content/plugins/paxdesign-booking/assets/js/widget-loader.js?n=${stamp}")
          SCREENSHOT=$(curl -sS -o /tmp/screenshot.png -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/screenshot.png?n=${stamp}")
          echo "PAGE $PAGE | THEME_CSS $THEME_CSS | CCS_CSS $CCS_CSS | CCS_JS $CCS_JS | ADMIN_JS $ADMIN_JS | ADMIN_NOTIFY_JS $ADMIN_NOTIFY_JS | PLUGIN $PLUGIN | BOOKING_JS $BOOKING_JS | AUTH_CSS $AUTH_CSS | CHAT $CHAT | AUTH_JS $AUTH_JS | WIDGET_LOADER $WIDGET_LOADER | SCREENSHOT $SCREENSHOT"
          test "$PAGE" = "200"
          test "$THEME_CSS" = "200"
          test "$CCS_CSS" = "200"
          test "$CCS_JS" = "200"
          test "$ADMIN_JS" = "200"
          test "$ADMIN_NOTIFY_JS" = "200"
          test "$AUTH_CSS" = "200"
          test "$CHAT" = "200"
          test "$AUTH_JS" = "200"
          test "$WIDGET_LOADER" = "200"
          test "$SCREENSHOT" = "200"
          file /tmp/screenshot.png | grep -Eq 'PNG image data'
          HOME=$(curl -sS -o /tmp/home-page.html -w '%{http_code}' "https://paxdesign.at/?n=${stamp}")
          test "$HOME" = "200"
          grep -Eq 'rel="preload" as="image"[^>]+code-2558220_1280\.avif' /tmp/home-page.html
          grep -Eq 'id="navein-home-critical-css"' /tmp/home-page.html
          grep -Eq "iconfont-css|fonts/iconfont\.css" /tmp/home-page.html
          ! grep -Eq "paxdesign-booking-styles-css[^\"']*media='print' onload" /tmp/home-page.html
          grep -Eq "Version: 1\.4\.37" /tmp/style.css
          grep -Eq "apple-cybercrime-support\.css\?ver=1\.4\.37|apple-cybercrime-support\.js\?ver=1\.4\.37" /tmp/ccs-page.html
          grep -Eq "independent online service|unabhängiger Online-Dienst|خدمة إلكترونية مستقلة" /tmp/ccs-page.html
          grep -Eq "navein-cybercrime-mobile-layout-fix" /tmp/ccs-page.html
          grep -Eq "pax-ccs-portal|pax-ccs-intake-form|pax-ccs-country-search|pax-ccs-phone-code" /tmp/ccs-page.html
          grep -Eq "full-bleed Apple-style|--ccs-gutter|pax-ccs-portal__coverage-track" /tmp/apple-ccs.css
          grep -Eq "initCountryPicker|validateAllSteps|pax-ccs-country-search" /tmp/apple-ccs.js
          grep -Eq "PAXdesignWidgetLoader" /tmp/widget-loader.js
          grep -Eq 'name="identity_document" required|pax-ccs-portal__required' /tmp/ccs-page.html
          grep -Eq "Sitewide isolated Sign In|background: #000 !important" /tmp/pdx-auth.css
          grep -Eq "isReportActive|applyReportLifecycle|pax-ccs-portal--report-closed" /tmp/apple-ccs.js
          grep -Eq "markStaffRead|paxdesign_cybercrime_admin_mark_read" /tmp/cybercrime-admin.js
          grep -Eq "paxCybercrimeAdminApplyUnread|paxdesign_cybercrime_admin_unread" /tmp/cybercrime-admin-notifications.js
          grep -Eq "paxdesign_cybercrime_admin_status|pax-cc-close-ticket|REQUEST_TIMEOUT_MS|markStaffRead" /tmp/cybercrime-admin.js
          grep -Eq "paxdesign-booking[^\"']*ver=3\.174\.59" /tmp/ccs-page.html
          grep -Eq "queueBackgroundRealtimeSync|shouldSkipHistoryFetch|HISTORY_INITIAL" /tmp/chat-script.js
          grep -Eq "renderPortalRecordsSection|renderPortalCybercrimeDetail|cybercrime/reports" /tmp/pax-auth.js
          grep -A6 '#pdx-auth-bar.pdx-auth-bar--header .pdx-auth-signup-btn {' /tmp/pdx-auth.css | grep -Eq 'background: #000|background-color: #000'
          if [ "$BOOKING_JS" = "200" ]; then
            grep -Eq 'ensureChatReady' /tmp/booking-script.js
            grep -Eq 'escapeHtml|paxdesign_get_team_members' /tmp/booking-script.js
          fi
          echo "Cybercrime Support production verification passed."

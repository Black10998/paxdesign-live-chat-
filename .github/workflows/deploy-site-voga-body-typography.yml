name: Deploy Site Voga Body Typography

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/deploy-site-voga-body-typography'
      - '.github/workflows/deploy-site-voga-body-typography.yml'
      - 'navein/assets/css/voga-diamond-fonts.css'
      - 'navein/assets/css/site-body-typography.css'
      - 'navein/assets/css/homepage-fonts.css'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/css/apple-cybercrime-support.css'
      - 'navein/assets/fonts/homepage/voga-medium.woff2'
      - 'navein/functions.php'
      - 'navein/inc/performance.php'
      - 'deploy-patches/restored-chat-human-ui/assets/css/booking-styles.css'
      - 'deploy-patches/restored-chat-human-ui/assets/customer-auth/css/pdx-tokens.css'
      - 'scripts/verify-site-voga-body-typography.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy site-wide Voga typography assets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          PLUGIN="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"
          PATCH="deploy-patches/restored-chat-human-ui"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css") $(printf '%q' "$THEME/assets/fonts/homepage") $(printf '%q' "$THEME/inc")"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/voga-diamond-fonts.css \
            navein/assets/css/site-body-typography.css \
            navein/assets/css/homepage-fonts.css \
            navein/assets/css/apple-homepage.css \
            navein/assets/css/apple-cybercrime-support.css \
            "${REMOTE}:${THEME}/assets/css/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/fonts/homepage/voga-medium.woff2 \
            "${REMOTE}:${THEME}/assets/fonts/homepage/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            "${REMOTE}:${THEME}/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/inc/performance.php \
            "${REMOTE}:${THEME}/inc/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            "$PATCH/assets/css/booking-styles.css" \
            "${REMOTE}:${PLUGIN}/assets/css/booking-styles.css"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            "$PATCH/assets/customer-auth/css/pdx-tokens.css" \
            "${REMOTE}:${PLUGIN}/assets/customer-auth/css/pdx-tokens.css"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp cache flush || true)"

          echo "Deployed site-wide Voga Diamond body typography"

      - name: Verify production typography
        run: |
          set -euo pipefail
          chmod +x scripts/verify-site-voga-body-typography.sh
          ./scripts/verify-site-voga-body-typography.sh

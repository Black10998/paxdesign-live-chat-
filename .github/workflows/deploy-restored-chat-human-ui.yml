name: Deploy restored chat human UI

# Surgical production patch on the restored 2026-08-08 WordPress baseline.
# Copies only the listed plugin files. Does NOT rsync the current GitHub plugin.
on:
  push:
    branches:
      - main
    paths:
      - 'deploy-patches/restored-chat-human-ui/**'
      - 'navein/assets/js/apple-cybercrime-support.js'
      - 'navein/assets/css/apple-cybercrime-support.css'
      - 'navein/template-parts/pages/cybercrime-support.php'
      - 'navein/template-parts/pages/cybercrime-support-data.php'
      - 'navein/inc/cybercrime-support-locale.php'
      - '.github/workflows/deploy-restored-chat-human-ui.yml'
      - 'scripts/verify-restored-chat-human-ui.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy patched chat files only
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          TARGET="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          SRC="deploy-patches/restored-chat-human-ui"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          rsync_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if rsync -az -e "ssh ${SSH_OPTS[*]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "rsync failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return 1
              fi
              echo "ssh failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          rsync_with_retry \
            "$SRC/paxdesign-booking.php" \
            "${REMOTE}:${TARGET}/paxdesign-booking.php"
          rsync_with_retry \
            "$SRC/assets/js/chat-script.js" \
            "${REMOTE}:${TARGET}/assets/js/chat-script.js"
          rsync_with_retry \
            "$SRC/assets/js/booking-script.js" \
            "${REMOTE}:${TARGET}/assets/js/booking-script.js"
          rsync_with_retry \
            "$SRC/assets/js/widget-loader.js" \
            "${REMOTE}:${TARGET}/assets/js/widget-loader.js"
          rsync_with_retry \
            "$SRC/assets/customer-auth/js/pax-auth.js" \
            "${REMOTE}:${TARGET}/assets/customer-auth/js/pax-auth.js"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-auth.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-auth.css"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-auth-page.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-auth-page.css"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-unified-ui.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-unified-ui.css"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-customer-ui.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-customer-ui.css"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-tokens.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-tokens.css"
          rsync_with_retry \
            "$SRC/assets/customer-auth/css/pdx-verified-badge.css" \
            "${REMOTE}:${TARGET}/assets/customer-auth/css/pdx-verified-badge.css"
          rsync_with_retry \
            "$SRC/assets/css/booking-styles.css" \
            "${REMOTE}:${TARGET}/assets/css/booking-styles.css"
          rsync_with_retry \
            "$SRC/assets/js/cybercrime-admin.js" \
            "${REMOTE}:${TARGET}/assets/js/cybercrime-admin.js"
          rsync_with_retry \
            "$SRC/templates/booking-widget.php" \
            "${REMOTE}:${TARGET}/templates/booking-widget.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-chat-live.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-chat-live.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-message-store.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-message-store.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-chat.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-chat.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-widget-performance.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-widget-performance.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-chat-knowledge.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-chat-knowledge.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-cybercrime-i18n.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-cybercrime-i18n.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-cybercrime-intake.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-cybercrime-intake.php"
          rsync_with_retry \
            "$SRC/includes/class-paxdesign-cybercrime-tickets.php" \
            "${REMOTE}:${TARGET}/includes/class-paxdesign-cybercrime-tickets.php"
          rsync_with_retry \
            "$SRC/includes/customer/class-paxdesign-customer-admin.php" \
            "${REMOTE}:${TARGET}/includes/customer/class-paxdesign-customer-admin.php"
          rsync_with_retry \
            "$SRC/includes/auth/class-paxdesign-auth-github.php" \
            "${REMOTE}:${TARGET}/includes/auth/class-paxdesign-auth-github.php"
          rsync_with_retry \
            "$SRC/includes/auth/class-paxdesign-auth-module.php" \
            "${REMOTE}:${TARGET}/includes/auth/class-paxdesign-auth-module.php"
          rsync_with_retry \
            "$SRC/includes/auth/class-paxdesign-auth-rest.php" \
            "${REMOTE}:${TARGET}/includes/auth/class-paxdesign-auth-rest.php"
          rsync_with_retry \
            "$SRC/includes/auth/class-paxdesign-auth-frontend.php" \
            "${REMOTE}:${TARGET}/includes/auth/class-paxdesign-auth-frontend.php"

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          rsync_with_retry \
            navein/assets/js/apple-cybercrime-support.js \
            "${REMOTE}:${THEME}/assets/js/apple-cybercrime-support.js"
          rsync_with_retry \
            navein/assets/css/apple-cybercrime-support.css \
            "${REMOTE}:${THEME}/assets/css/apple-cybercrime-support.css"
          rsync_with_retry \
            navein/template-parts/pages/cybercrime-support.php \
            navein/template-parts/pages/cybercrime-support-data.php \
            "${REMOTE}:${THEME}/template-parts/pages/"
          rsync_with_retry \
            navein/inc/cybercrime-support-locale.php \
            "${REMOTE}:${THEME}/inc/cybercrime-support-locale.php"

          ssh_with_retry "$REMOTE" \
            "cd '$(printf '%q' "$WP_PATH")' && \
             rm -f .maintenance && \
             (command -v wp >/dev/null && wp maintenance-mode deactivate 2>/dev/null || true) && \
             (command -v wp >/dev/null && wp cache flush || true) && \
             (command -v wp >/dev/null && wp litespeed-purge all || true) && \
             (php -r 'if (function_exists(\"opcache_reset\")) { opcache_reset(); echo \"opcache_reset=ok\\n\"; } else { echo \"opcache_reset=skipped\\n\"; }' || true)"

      - name: Verify deployed PHP evidence handlers on server
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"
          TARGET="${WP_PATH%/}/wp-content/plugins/paxdesign-booking/includes/class-paxdesign-cybercrime-tickets.php"
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "${SSH_OPTS[@]}" "$REMOTE" "grep -q append_report_attachments '$(printf '%q' "$TARGET")' && grep -q collect_message_attachments '$(printf '%q' "$TARGET")' && grep -q mark_evidence_requests_fulfilled '$(printf '%q' "$TARGET")' && grep -q has_active_evidence_request '$(printf '%q' "$TARGET")' && echo 'OK: live tickets.php includes evidence attachment handlers'"

      - name: Verify evidence resubmit pipeline on production
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-evidence-resubmit-production.sh
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"
          WP_PATH_QUOTED=$(printf '%q' "$WP_PATH")
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "${SSH_OPTS[@]}" "$REMOTE" "WP_PATH=${WP_PATH_QUOTED} bash -s" \
            < scripts/verify-evidence-resubmit-production.sh

      - name: Verify live chat assets
        run: |
          set -euo pipefail
          chmod +x scripts/verify-restored-chat-human-ui.sh
          ./scripts/verify-restored-chat-human-ui.sh

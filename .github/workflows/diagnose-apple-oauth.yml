name: Diagnose Apple OAuth production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Apple OAuth trace from production
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-oauth-diagnose.php" | tee apple-oauth-diagnose.log
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '$(printf '%q' "$WP_PATH")' && wp eval-file wp-content/plugins/paxdesign-booking/scripts/wp-eval-apple-oauth-trace.php" | tee apple-oauth-trace.log

      - uses: actions/upload-artifact@v4
        with:
          name: apple-oauth-trace
          path: apple-oauth-trace.log

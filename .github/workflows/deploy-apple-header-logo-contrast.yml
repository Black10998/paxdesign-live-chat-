name: Deploy Apple Header Logo Contrast

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-header-logo-contrast-cfc9'
    paths:
      - '.github/triggers/deploy-apple-header-logo-contrast'
      - '.github/workflows/deploy-apple-header-logo-contrast.yml'
      - 'navein/assets/css/apple-sticky-header.css'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy header logo contrast fix
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css") $(printf '%q' "$THEME/.apple-header-logo-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-header-logo-backups/$STAMP")
             mkdir -p \"\$BACKUP/assets/css\"
             for f in style.css functions.php assets/css/apple-sticky-header.css; do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-sticky-header.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple header logo contrast 1.1.6"

      - name: Verify live logo contrast
        run: |
          set -euo pipefail
          set +e
          HOME_HTML=$(curl -sS -o /tmp/home-logo.html -w '%{http_code}' "https://paxdesign.at/?n=$(date +%s)")
          CSS=$(curl -sS -o /tmp/apple-sticky-header.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-sticky-header.css?ver=1.1.6")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          grep -Eq "apple-sticky-header.css\?ver=1.1.6|style.css\?ver=1.1.6" /tmp/home-logo.html
          grep -Eq "dtr-apple-header-logo-ink|paxlogo-code-slot" /tmp/apple-sticky-header.css
          grep -Eq "fill: var\(--dtr-apple-header-logo-ink|#1d1d1f" /tmp/apple-sticky-header.css
          grep -Eq "#dtr-responsive-header a.dtr-logo.logo-default .paxlogo-code-slot" /tmp/apple-sticky-header.css
          echo "Apple header logo contrast verification passed."

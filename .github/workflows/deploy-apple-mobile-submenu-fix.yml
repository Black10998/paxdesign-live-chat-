name: Deploy Apple Mobile Submenu Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-mobile-submenu-fix-cfc9'
    paths:
      - '.github/triggers/deploy-apple-mobile-submenu-fix'
      - '.github/workflows/deploy-apple-mobile-submenu-fix.yml'
      - 'navein/assets/css/apple-mobile-nav.css'
      - 'navein/assets/js/apple-mobile-nav.js'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy mobile submenu accordion fix
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css") $(printf '%q' "$THEME/assets/js")"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-mobile-nav.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-mobile-nav.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple mobile submenu fix 1.1.5"

      - name: Verify live mobile submenu fix
        run: |
          set -euo pipefail
          set +e
          HOME_HTML=$(curl -sS -o /tmp/home-msub.html -w '%{http_code}' "https://paxdesign.at/?n=$(date +%s)")
          CSS=$(curl -sS -o /tmp/apple-mobile-nav.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-mobile-nav.css?ver=1.1.5")
          JS=$(curl -sS -o /tmp/apple-mobile-nav.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-mobile-nav.js?ver=1.1.5")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | JS $JS"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$JS" = "200"
          grep -Eq "navein-apple-mobile-nav|apple-mobile-nav.js\?ver=1.1.5" /tmp/home-msub.html
          grep -Eq "removeAttr\('style'\)|bindAccordion|display', 'block'|amnavAcc" /tmp/apple-mobile-nav.js
          grep -Eq "display: block !important|dtr-apple-mnav__item.is-open" /tmp/apple-mobile-nav.css
          echo "Apple mobile submenu fix verification passed."

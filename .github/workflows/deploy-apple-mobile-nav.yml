name: Deploy Apple Mobile Nav

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-mobile-nav-cfc9'
    paths:
      - '.github/triggers/deploy-apple-mobile-nav'
      - '.github/workflows/deploy-apple-mobile-nav.yml'
      - 'navein/assets/css/apple-mobile-nav.css'
      - 'navein/assets/js/apple-mobile-nav.js'
      - 'navein/assets/css/mega-menu.css'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy Apple mobile navigation assets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/js") \
              $(printf '%q' "$THEME/.apple-mobile-nav-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-mobile-nav-backups/$STAMP")
             mkdir -p \"\$BACKUP\"
             for f in \
               functions.php \
               style.css \
               assets/css/mega-menu.css \
               assets/css/apple-mobile-nav.css \
               assets/js/apple-mobile-nav.js
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-mobile-nav.css \
            navein/assets/css/mega-menu.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/js/apple-mobile-nav.js \
            "${REMOTE}:${THEME}/assets/js/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple mobile nav 1.1.3"

      - name: Verify live mobile nav assets
        run: |
          set -euo pipefail
          set +e
          HOME_HTML=$(curl -sS -o /tmp/home-mnav.html -w '%{http_code}' "https://paxdesign.at/?n=$(date +%s)")
          CSS=$(curl -sS -o /tmp/apple-mobile-nav.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-mobile-nav.css?ver=1.1.3")
          JS=$(curl -sS -o /tmp/apple-mobile-nav.js -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/js/apple-mobile-nav.js?ver=1.1.3")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | JS $JS"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$JS" = "200"
          grep -Eq "navein-apple-mobile-nav|apple-mobile-nav.css" /tmp/home-mnav.html
          grep -Eq "apple-mobile-nav.js|navein-apple-mobile-nav-js" /tmp/home-mnav.html
          grep -Eq "dtr-has-mega|dtr-mega-icon|dtr-mega-panel" /tmp/home-mnav.html
          grep -Eq "dtr-apple-mnav|full-screen|PAXdesign" /tmp/apple-mobile-nav.css
          grep -Eq "appleMobileNav|dtr-apple-mobile-nav|dtr-mega-panel" /tmp/apple-mobile-nav.js
          grep -Eq "style.css\?ver=1.1.3|apple-mobile-nav.css\?ver=1.1.3" /tmp/home-mnav.html
          grep -Eq "navein-apple-sticky-header|apple-sticky-header" /tmp/home-mnav.html
          echo "Apple mobile nav verification passed."

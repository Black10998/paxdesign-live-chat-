name: Deploy Apple Homepage Typography

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/deploy-apple-homepage-typography'
      - '.github/workflows/deploy-apple-homepage-typography.yml'
      - 'navein/assets/css/homepage-fonts.css'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/fonts/homepage/**'
      - 'navein/functions.php'
      - 'navein/inc/performance.php'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy homepage typography assets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p $(printf '%q' "$THEME/assets/css") $(printf '%q' "$THEME/assets/fonts/homepage")"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/homepage-fonts.css \
            navein/assets/css/apple-homepage.css \
            "${REMOTE}:${THEME}/assets/css/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/fonts/homepage/ \
            "${REMOTE}:${THEME}/assets/fonts/homepage/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            "${REMOTE}:${THEME}/"

          rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/inc/performance.php \
            "${REMOTE}:${THEME}/inc/"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd '$(printf '%q' "$WP_PATH")' && (command -v wp >/dev/null && wp cache flush || true)"

          echo "Deployed homepage typography (Orbitron + Voga)"

      - name: Verify live homepage fonts
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          HOME=$(curl -sS -o /tmp/home-page.html -w '%{http_code}' "https://paxdesign.at/?n=${stamp}")
          FONTS_CSS=$(curl -sS -o /tmp/homepage-fonts.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/css/homepage-fonts.css?n=${stamp}")
          HP_CSS=$(curl -sS -o /tmp/apple-homepage.css -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-homepage.css?n=${stamp}")
          ORBITRON=$(curl -sS -o /tmp/orbitron.woff2 -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/fonts/homepage/orbitron-v35-latin-regular.woff2?n=${stamp}")
          VOGA=$(curl -sS -o /tmp/voga.woff2 -w '%{http_code}' "https://paxdesign.at/wp-content/themes/navein/assets/fonts/homepage/voga-medium.woff2?n=${stamp}")
          echo "HOME $HOME | FONTS_CSS $FONTS_CSS | HP_CSS $HP_CSS | ORBITRON $ORBITRON | VOGA $VOGA"
          test "$HOME" = "200"
          test "$FONTS_CSS" = "200"
          test "$HP_CSS" = "200"
          test "$ORBITRON" = "200"
          test "$VOGA" = "200"
          file /tmp/orbitron.woff2 | grep -Eq 'Web Open Font Format|woff'
          file /tmp/voga.woff2 | grep -Eq 'Web Open Font Format|woff'
          grep -Eq 'font-family: "Orbitron"' /tmp/homepage-fonts.css
          grep -Eq 'font-family: "Voga Diamond"' /tmp/homepage-fonts.css
          grep -Eq '\-\-ph-display: "Orbitron"' /tmp/apple-homepage.css
          grep -Eq '\-\-ph-text: "Voga Diamond"' /tmp/apple-homepage.css
          grep -Eq 'homepage-fonts\.css' /tmp/home-page.html
          grep -Eq 'font-weight: 400' /tmp/homepage-fonts.css
          grep -Eq 'font-family: var\(--ph-text\)' /tmp/apple-homepage.css
          grep -Eq 'preload" as="font".*orbitron-v35-latin-regular' /tmp/home-page.html
          echo "Homepage typography production verification passed."

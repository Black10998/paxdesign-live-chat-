name: Deploy WordPress Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy (e.g. v3.99.0)
        required: true
        default: v3.99.0

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        id: secrets
        run: |
          missing=0
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Abort when deployment secrets are missing
        if: steps.secrets.outputs.has_secrets != 'true'
        run: |
          echo "Deployment secrets are not configured on this repository."
          echo "Configure WP_SSH_HOST, WP_SSH_USER, WP_SSH_PRIVATE_KEY, and WP_PATH to enable automated production deploy."
          exit 1

      - name: Download release ZIP
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          curl -fsSL -o "paxdesign-booking-v${VERSION}.zip" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/paxdesign-booking-v${VERSION}.zip"
          unzip -q "paxdesign-booking-v${VERSION}.zip"

      - name: Deploy plugin over SSH
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          TARGET="${WP_PATH%/}/wp-content/plugins/paxdesign-booking"
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            paxdesign-booking/ "${WP_SSH_USER}@${WP_SSH_HOST}:${TARGET}/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "cd '${WP_PATH}' && (command -v wp >/dev/null && wp plugin deactivate paxdesign-toolbar --quiet 2>/dev/null || true) && (command -v wp >/dev/null && wp plugin activate paxdesign-booking || true) && (command -v wp >/dev/null && wp cache flush || true)"

      - name: Deploy navein theme shell (mobile nav, referenzen wrapper, footer)
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            navein/assets/css/apple-mobile-nav.css \
            navein/assets/css/apple-sticky-header.css \
            navein/assets/css/apple-inner-page-title.css \
            navein/assets/css/apple-footer.css \
            "${REMOTE}:${THEME}/assets/css/" 2>/dev/null || true
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            navein/assets/js/apple-mobile-nav.js \
            navein/assets/js/apple-sticky-header.js \
            navein/assets/js/apple-footer.js \
            "${REMOTE}:${THEME}/assets/js/" 2>/dev/null || true
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            navein/template-apple-referenzen.php \
            "${REMOTE}:${THEME}/" 2>/dev/null || true

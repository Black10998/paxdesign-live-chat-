name: Guard production baseline 3.174.128

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production baseline guards
        run: php tests/production-baseline/run.php
      - name: Restored overlay guards
        run: php tests/restored-chat-human-ui/run.php
      - name: CCS baseline guards
        run: php tests/ccs-ai/run.php
      - name: Merge-integration guards
        run: php tests/merge-integration/run.php
      - name: Public identity hardening guards
        run: php tests/public-identity-hardening/run.php
      - name: Chat readable-font guards
        run: php tests/chat-readable-fonts/run.php
      - name: Account Apple UI guards
        run: php tests/account-apple-ui/run.php

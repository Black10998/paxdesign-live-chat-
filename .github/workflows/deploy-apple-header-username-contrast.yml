name: Deploy Apple header username contrast

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-header-username-contrast-cfc9'
    paths:
      - '.github/triggers/deploy-apple-header-username-contrast'
      - '.github/workflows/deploy-apple-header-username-contrast.yml'
      - 'navein/assets/css/apple-sticky-header.css'
      - 'navein/functions.php'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy username contrast fix
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/.apple-header-username-contrast-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-header-username-contrast-backups/$STAMP")
             mkdir -p \"\$BACKUP\"
             for f in style.css functions.php assets/css/apple-sticky-header.css
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-sticky-header.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/functions.php \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          # Soft-patch Additional CSS: white logged-in auth text → dark for light header.
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && wp eval '
\$post_id = (int) get_option(\"custom_css_post_id\");
if (\$post_id > 0) {
  \$post = get_post(\$post_id);
  if (\$post && isset(\$post->post_content)) {
    \$css = \$post->post_content;
    \$orig = \$css;
    \$css = preg_replace(
      \"/(header\\\\s+#pdx-auth-bar\\\\s+\\\\.pdx-auth-trigger[^{]*\\\\{[^}]*?)color\\\\s*:\\\\s*#ffffff\\\\s*!important/is\",
      \"\$1color: #000000 !important\",
      \$css
    );
    \$css = preg_replace(
      \"/(header\\\\s+button\\\\.pdx-auth-trigger\\\\.pdx-auth-trigger--(?:logged-in|verified)[^{]*\\\\{[^}]*?)color\\\\s*:\\\\s*#ffffff\\\\s*!important/is\",
      \"\$1color: #000000 !important\",
      \$css
    );
    \$css = preg_replace(
      \"/(#pdx-auth-bar\\\\s+\\\\.pdx-name-with-badge\\\\s*\\\\{[^}]*?)color\\\\s*:\\\\s*#fff(?:fff)?\\\\s*!important/is\",
      \"\$1color: #000000 !important\",
      \$css
    );
    if (\$css !== \$orig) {
      wp_update_post(array(\"ID\" => \$post_id, \"post_content\" => \$css));
      echo \"Updated custom_css post {\$post_id}\\n\";
    } else {
      echo \"custom_css unchanged (no matching white auth rules)\\n\";
    }
  }
} else {
  echo \"No custom_css_post_id\\n\";
}
' && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple header username contrast 1.4.2"

      - name: Verify live username contrast
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          set +e
          HOME_HTML=$(curl -sS -A "Mozilla/5.0" -o /tmp/home-username.html -w '%{http_code}' \
            "https://paxdesign.at/?n=${stamp}")
          CSS=$(curl -sS -A "Mozilla/5.0" -o /tmp/apple-sticky-header.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-sticky-header.css?ver=1.4.2&n=${stamp}")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          grep -Eq 'pdx-auth-account-btn|pdx-name-with-badge' /tmp/apple-sticky-header.css
          grep -Eq 'Logged-in username contrast|color: var\(--dtr-apple-header-text' /tmp/apple-sticky-header.css
          grep -Eq 'style\.css\?ver=1\.4\.2|apple-sticky-header\.css\?ver=1\.4\.2' /tmp/home-username.html
          grep -Eq 'navein-apple-auth-username-contrast' /tmp/home-username.html
          echo "Header username contrast verification passed."

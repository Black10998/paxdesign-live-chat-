name: Upload Customer Portal TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/customer-portal-testflight-upload'

permissions:
  contents: read
  actions: read

jobs:
  upload-customer-testflight:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APP_BUNDLE_ID: at.paxdesign.customerportal
      TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read expected build number
        id: version
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-customer-portal/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Resolve Customer Portal IPA run
        id: latest_ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-customer-portal-appstore.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Customer Portal App Store build found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed Customer Portal IPA
        uses: actions/download-artifact@v4
        with:
          name: PAXCustomerPortal-AppStore-ipa
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest_ipa.outputs.run_id }}
          path: artifacts/ipa

      - name: Validate IPA metadata
        run: |
          set -euo pipefail
          IPA="artifacts/ipa/PAXCustomerPortal-AppStore.ipa"
          [[ -f "$IPA" ]] || { echo "IPA missing: $IPA" >&2; exit 1; }
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          unzip -q "$IPA" -d "$WORKDIR"
          APP_PATH="$(find "$WORKDIR/Payload" -maxdepth 1 -name '*.app' -type d | head -1)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXPECTED="${{ steps.version.outputs.build }}"
          EXPECTED_BUNDLE="${APP_BUNDLE_ID}"
          echo "IPA CFBundleIdentifier=$BUNDLE_ID (expected $EXPECTED_BUNDLE)"
          echo "IPA CFBundleVersion=$BUNDLE_VERSION (expected $EXPECTED)"
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE" ]] || exit 1
          [[ "$BUNDLE_VERSION" == "$EXPECTED" ]] || exit 1

      - name: Validate App Store Connect private key
        run: python3 scripts/appstore-connect/prepare-asc-key.py

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography

      - name: Verify App Store Connect API credentials
        run: python3 scripts/appstore-connect/verify-asc-credentials.py

      - name: Resolve Customer Portal App Store Connect app
        id: asc_app
        run: python3 scripts/appstore-connect/resolve_asc_app.py

      - name: Upload IPA to TestFlight
        env:
          ASC_APP_APPLE_ID: ${{ steps.asc_app.outputs.asc_app_apple_id }}
          ALTOOL_EXTRA_ARGS: --use-old-altool
        run: |
          set +x
          chmod +x scripts/appstore-connect/upload-ipa.sh
          ./scripts/appstore-connect/upload-ipa.sh artifacts/ipa/PAXCustomerPortal-AppStore.ipa

      - name: Wait for processing and enable internal TestFlight
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.version.outputs.build }}
        run: python3 scripts/appstore-connect/enable_internal_testflight.py

      - name: Verify internal TestFlight access
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.version.outputs.build }}
        run: python3 scripts/appstore-connect/verify_internal_testflight.py

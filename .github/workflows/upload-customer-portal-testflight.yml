name: Upload Customer Portal TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/customer-portal-testflight-upload'

permissions:
  contents: read
  actions: read

jobs:
  upload-customer-testflight:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APP_BUNDLE_ID: at.paxdesign.customerportal
      TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read expected build number
        id: version
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-customer-portal/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Resolve Customer Portal IPA run
        id: latest_ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-customer-portal-appstore.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Customer Portal App Store build found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed Customer Portal IPA
        uses: actions/download-artifact@v4
        with:
          name: PAXCustomerPortal-AppStore-ipa
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest_ipa.outputs.run_id }}
          path: artifacts/ipa

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA="artifacts/ipa/PAXCustomerPortal-AppStore.ipa"
          [[ -f "$IPA" ]] || { echo "IPA missing" >&2; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${APP_STORE_CONNECT_API_PRIVATE_KEY:-}" ]]; then
            printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$KEY_PATH"
          elif [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ]]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 -D > "$KEY_PATH"
          else
            echo "Missing App Store Connect API key" >&2
            exit 1
          fi
          KEY_ID="${APP_STORE_CONNECT_API_KEY_ID:-${APPSTORE_API_KEY_ID:-}}"
          ISSUER="${APP_STORE_CONNECT_ISSUER_ID:-${APPSTORE_ISSUER_ID:-}}"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --apiKeyPath "$KEY_PATH"

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet PyJWT cryptography

      - name: Wait for processing and enable internal TestFlight
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.version.outputs.build }}
        run: python3 scripts/appstore-connect/enable_internal_testflight.py

      - name: Verify internal TestFlight access
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.version.outputs.build }}
        run: python3 scripts/appstore-connect/verify_internal_testflight.py

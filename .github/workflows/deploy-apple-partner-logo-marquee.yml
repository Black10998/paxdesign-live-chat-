name: Deploy Apple partner logo marquee

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/apple-partner-logo-marquee-cfc9'
    paths:
      - '.github/triggers/deploy-apple-partner-logo-marquee'
      - '.github/workflows/deploy-apple-partner-logo-marquee.yml'
      - 'navein/template-parts/pages/homepage.php'
      - 'navein/assets/css/apple-homepage.css'
      - 'navein/assets/img/partners/**'
      - 'navein/style.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}

      - name: Deploy Apple partner logo marquee
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          THEME="${WP_PATH%/}/wp-content/themes/navein"
          REMOTE="${WP_SSH_USER}@${WP_SSH_HOST}"

          retry() {
            local attempt=1
            local delay=4
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${attempt}/4 after ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p \
              $(printf '%q' "$THEME/assets/css") \
              $(printf '%q' "$THEME/assets/img/partners") \
              $(printf '%q' "$THEME/template-parts/pages") \
              $(printf '%q' "$THEME/.apple-partner-logo-marquee-backups")"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "BACKUP=$(printf '%q' "$THEME/.apple-partner-logo-marquee-backups/$STAMP")
             mkdir -p \"\$BACKUP/assets/css\" \"\$BACKUP/template-parts/pages\"
             for f in style.css \
               assets/css/apple-homepage.css \
               template-parts/pages/homepage.php
             do
               if [ -f $(printf '%q' "$THEME")/\$f ]; then
                 mkdir -p \"\$BACKUP/\$(dirname \"\$f\")\"
                 cp -a $(printf '%q' "$THEME")/\$f \"\$BACKUP/\$f\"
               fi
             done
             echo \"Backup written to \$BACKUP\""

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/css/apple-homepage.css \
            "${REMOTE}:${THEME}/assets/css/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/assets/img/partners/ \
            "${REMOTE}:${THEME}/assets/img/partners/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/template-parts/pages/homepage.php \
            "${REMOTE}:${THEME}/template-parts/pages/"

          retry rsync -az -e "ssh ${SSH_OPTS[*]}" \
            navein/style.css \
            "${REMOTE}:${THEME}/"

          retry ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "cd $(printf '%q' "$WP_PATH") && (wp cache flush >/dev/null 2>&1 || true)"

          echo "Deployed Apple partner logo marquee 1.3.9"

      - name: Verify live partner logo marquee
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          set +e
          HOME_HTML=$(curl -sS -A "Mozilla/5.0" -o /tmp/home-partners.html -w '%{http_code}' \
            "https://paxdesign.at/?n=${stamp}")
          CSS=$(curl -sS -A "Mozilla/5.0" -o /tmp/apple-homepage.css -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/css/apple-homepage.css?ver=1.3.9")
          APPLE=$(curl -sS -A "Mozilla/5.0" -o /tmp/partner-apple.svg -w '%{http_code}' \
            "https://paxdesign.at/wp-content/themes/navein/assets/img/partners/apple.svg")
          set -e
          echo "HOME $HOME_HTML | CSS $CSS | APPLE $APPLE"
          test "$HOME_HTML" = "200"
          test "$CSS" = "200"
          test "$APPLE" = "200"
          grep -Eq 'pax-sw-ribbon--partners' /tmp/apple-homepage.css
          grep -Eq 'pax-sw-ribbon__logo' /tmp/apple-homepage.css
          grep -Eq 'pax-sw-ribbon--partners' /tmp/home-partners.html
          grep -Eq 'assets/img/partners/apple\.svg' /tmp/home-partners.html
          grep -Eq 'assets/img/partners/(android|microsoft|github|figma|aws|openai|cloudflare)\.svg' /tmp/home-partners.html
          # Existing tech ticker must still be present and unchanged in role
          grep -Eq 'aria-label="Tech Stack"' /tmp/home-partners.html
          grep -Eq '>Java<|>Python<|>Spring Boot<' /tmp/home-partners.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/home-partners.html').read_text(errors='ignore')
          # Partner ribbon must appear after hero
          hero = html.find('pax-home-hero')
          partners = html.find('pax-sw-ribbon--partners')
          tech = html.find('aria-label="Tech Stack"')
          assert tech != -1 and hero != -1 and partners != -1
          assert tech < hero < partners, (tech, hero, partners)
          print('Order OK: tech ticker → hero → partner logos')
          PY
          grep -Eq 'apple-homepage\.css\?ver=1\.3\.9|style\.css\?ver=1\.3\.9' /tmp/home-partners.html
          echo "Apple partner logo marquee verification passed."

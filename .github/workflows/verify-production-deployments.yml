name: Verify production deployments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/verify-deployments'
      - 'scripts/verify-debug-log-post-deploy.sh'
      - 'scripts/verify-3132-post-deploy.sh'
      - 'scripts/trace-ios-http-profile.sh'

permissions:
  contents: read

jobs:
  verify-wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        run: |
          for key in WP_SSH_HOST WP_SSH_USER WP_SSH_PRIVATE_KEY WP_PATH; do
            [ -n "${!key:-}" ] || { echo "Missing $key"; exit 1; }
          done
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
      - name: Verify plugin 3.112.0 and iOS HTTP profile
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_PATH: ${{ secrets.WP_PATH }}
          PAX_SITE: https://paxdesign.at
          PAX_ADMIN_USER: ${{ secrets.PAX_ADMIN_USER }}
          PAX_ADMIN_APP_PASSWORD: ${{ secrets.PAX_ADMIN_APP_PASSWORD }}
        run: |
          PORT="${WP_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$WP_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod +x scripts/verify-debug-log-post-deploy.sh scripts/trace-ios-http-profile.sh
          ssh "${SSH_OPTS[@]}" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "WP_PATH=$(printf '%q' "$WP_PATH") PAX_SITE=$(printf '%q' "$PAX_SITE") PAX_ADMIN_USER=$(printf '%q' "$PAX_ADMIN_USER") PAX_ADMIN_APP_PASSWORD=$(printf '%q' "$PAX_ADMIN_APP_PASSWORD") bash -s" \
            < scripts/verify-debug-log-post-deploy.sh | tee wp-verify.log
          bash scripts/trace-ios-http-profile.sh | tee ios-profile.log
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-verify
          path: |
            wp-verify.log
            ios-profile.log

  verify-testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/appstore-connect/prepare-asc-key.py
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      - run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography
      - name: Verify TestFlight internal build
        env:
          APP_BUNDLE_ID: at.paxdesign.livechat
          TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-live-chat/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "Expected build from project.yml: $BUILD"
          TESTFLIGHT_TARGET_BUILD="$BUILD" python3 scripts/appstore-connect/verify_internal_testflight.py

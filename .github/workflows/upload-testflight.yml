name: Upload TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/testflight-upload'

permissions:
  contents: read
  actions: read

jobs:
  upload-testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: at.paxdesign.livechat
      TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read expected build number
        id: version
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-live-chat/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Expected CFBundleVersion: $BUILD"

      - name: Resolve App Store IPA run
        id: latest_ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.version.outputs.build }}"
          SHA="${{ github.sha }}"
          DEADLINE=$(( $(date +%s) + 1800 ))
          RUN_ID=""

          while [[ $(date +%s) -lt $DEADLINE ]]; do
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --commit "$SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$RUN_ID" ]]; then
              echo "Using App Store IPA from commit $SHA (run $RUN_ID)"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IN_PROGRESS="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --commit "$SHA" \
              --status in_progress \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$IN_PROGRESS" ]]; then
              echo "Waiting for App Store build run $IN_PROGRESS on commit $SHA..."
              sleep 30
              continue
            fi

            break
          done

          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-appstore.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful App Store IPA workflow run found" >&2
            exit 1
          fi
          echo "Using latest successful App Store IPA run $RUN_ID (commit may differ from $SHA)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed App Store IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: PAXDesignLiveChat-AppStore-ipa
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest_ipa.outputs.run_id }}
          path: artifacts/ipa

      - name: Validate IPA build number
        run: |
          set -euo pipefail
          IPA="artifacts/ipa/PAXDesignLiveChat-AppStore.ipa"
          [[ -f "$IPA" ]] || { echo "IPA missing: $IPA" >&2; exit 1; }
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          unzip -q "$IPA" -d "$WORKDIR"
          APP_PATH="$(find "$WORKDIR/Payload" -maxdepth 1 -name '*.app' -type d | head -1)"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXPECTED="${{ steps.version.outputs.build }}"
          echo "IPA CFBundleVersion=$BUNDLE_VERSION (expected $EXPECTED)"
          if [[ "$BUNDLE_VERSION" != "$EXPECTED" ]]; then
            echo "ERROR: IPA build number $BUNDLE_VERSION does not match project.yml ($EXPECTED)." >&2
            echo "Wait for the App Store build workflow on this commit, then rerun upload." >&2
            exit 1
          fi

      - name: Validate App Store Connect private key
        run: python3 scripts/appstore-connect/prepare-asc-key.py

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography

      - name: Verify App Store Connect API credentials
        run: python3 scripts/appstore-connect/verify-asc-credentials.py

      - name: Upload IPA to TestFlight
        shell: bash
        run: |
          set +x
          chmod +x scripts/appstore-connect/upload-ipa.sh
          ./scripts/appstore-connect/upload-ipa.sh artifacts/ipa/PAXDesignLiveChat-AppStore.ipa

      - name: Enable internal TestFlight testing
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.version.outputs.build }}
          TESTFLIGHT_POLL_SECONDS: "30"
          TESTFLIGHT_POLL_TIMEOUT: "3600"
        run: python3 scripts/appstore-connect/enable_testflight_build.py

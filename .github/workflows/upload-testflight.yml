name: Upload TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/testflight-upload'

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-upload
  cancel-in-progress: true

jobs:
  resolve-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.version.outputs.build }}
      run_id: ${{ steps.latest_ipa.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read expected build number
        id: version
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-live-chat/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Expected CFBundleVersion: $BUILD"

      - name: Resolve App Store IPA run
        id: latest_ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.version.outputs.build }}"
          SHA="${{ github.sha }}"
          FALLBACK_AFTER=$(( $(date +%s) + 60 ))
          DEADLINE=$(( $(date +%s) + 900 ))
          RUN_ID=""

          if [[ -f .github/triggers/testflight-upload ]]; then
            PIN="$(grep -E '^RUN_ID=[0-9]+$' .github/triggers/testflight-upload | head -1 | cut -d= -f2 || true)"
            if [[ -n "${PIN:-}" ]]; then
              echo "Using pinned App Store IPA run $PIN from trigger file"
              echo "run_id=$PIN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          find_successful_run() {
            local commit_sha="$1"
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --commit "$commit_sha" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          }

          find_in_progress_run() {
            local commit_sha="$1"
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --commit "$commit_sha" \
              --json databaseId,status \
              --limit 5 \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued") | .databaseId] | first // empty'
          }

          find_main_in_progress_run() {
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --branch main \
              --json databaseId,status \
              --limit 10 \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued") | .databaseId] | first // empty'
          }

          find_latest_successful_main() {
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-appstore.yml \
              --branch main \
              --status success \
              --limit 15 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          }

          if [[ -n "${TESTFLIGHT_IPA_RUN_ID:-}" ]]; then
            echo "Using pinned App Store IPA run $TESTFLIGHT_IPA_RUN_ID"
            echo "run_id=$TESTFLIGHT_IPA_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while [[ $(date +%s) -lt $DEADLINE ]]; do
            RUN_ID="$(find_successful_run "$SHA")"
            if [[ -n "$RUN_ID" ]]; then
              echo "Using App Store IPA from commit $SHA (run $RUN_ID)"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IN_PROGRESS="$(find_in_progress_run "$SHA")"
            if [[ -z "$IN_PROGRESS" ]]; then
              IN_PROGRESS="$(find_main_in_progress_run)"
            fi
            if [[ -n "$IN_PROGRESS" ]]; then
              echo "Waiting for App Store build run $IN_PROGRESS (expected build $EXPECTED)..."
              sleep 20
              continue
            fi

            if [[ $(date +%s) -ge $FALLBACK_AFTER ]]; then
              RUN_ID="$(find_latest_successful_main)"
              if [[ -n "$RUN_ID" ]]; then
                echo "Using latest successful main App Store run $RUN_ID (CFBundleVersion validated next)."
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "Waiting for App Store build workflow on commit $SHA (expected build $EXPECTED)..."
            sleep 20
          done

          RUN_ID="$(find_successful_run "$SHA")"
          if [[ -n "$RUN_ID" ]]; then
            echo "Using App Store IPA from commit $SHA (run $RUN_ID)"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: No successful App Store IPA for commit $SHA after waiting." >&2
          exit 1

      - name: Download signed App Store IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: PAXDesignLiveChat-AppStore-ipa
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest_ipa.outputs.run_id }}
          path: artifacts/ipa

      - name: Validate IPA build number
        run: |
          set -euo pipefail
          IPA="artifacts/ipa/PAXDesignLiveChat-AppStore.ipa"
          [[ -f "$IPA" ]] || { echo "IPA missing: $IPA" >&2; exit 1; }
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          sudo apt-get update -qq && sudo apt-get install -y -qq libplist-utils unzip
          unzip -q "$IPA" -d "$WORKDIR"
          APP_PATH="$(find "$WORKDIR/Payload" -maxdepth 1 -name '*.app' -type d | head -1)"
          BUNDLE_VERSION="$(plistutil -i "$APP_PATH/Info.plist" 2>/dev/null | grep -A1 CFBundleVersion | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/' || plutil -extract CFBundleVersion raw "$APP_PATH/Info.plist")"
          EXPECTED="${{ steps.version.outputs.build }}"
          echo "IPA CFBundleVersion=$BUNDLE_VERSION (expected $EXPECTED)"
          if [[ "$BUNDLE_VERSION" != "$EXPECTED" ]]; then
            echo "ERROR: IPA build number $BUNDLE_VERSION does not match project.yml ($EXPECTED)." >&2
            exit 1
          fi

      - name: Upload validated IPA for macOS job
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
          path: artifacts/ipa/PAXDesignLiveChat-AppStore.ipa
          if-no-files-found: error

  upload-testflight:
    needs: resolve-ipa
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: at.paxdesign.livechat
      TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated IPA
        uses: actions/download-artifact@v4
        with:
          name: testflight-ipa
          path: artifacts/ipa

      - name: Validate App Store Connect private key
        run: python3 scripts/appstore-connect/prepare-asc-key.py

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography

      - name: Verify App Store Connect API credentials
        run: python3 scripts/appstore-connect/verify-asc-credentials.py

      - name: Upload IPA to TestFlight
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set +x
          chmod +x scripts/appstore-connect/upload-ipa.sh
          ./scripts/appstore-connect/upload-ipa.sh artifacts/ipa/PAXDesignLiveChat-AppStore.ipa

      - name: Clean up obsolete TestFlight builds before retry
        if: steps.upload.outcome == 'failure'
        env:
          TESTFLIGHT_KEEP_BUILD: "158"
        run: python3 scripts/appstore-connect/cleanup_testflight_builds.py

      - name: Retry Upload IPA to TestFlight
        id: upload_retry
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: |
          set +x
          ./scripts/appstore-connect/upload-ipa.sh artifacts/ipa/PAXDesignLiveChat-AppStore.ipa

      - name: Require successful upload
        if: steps.upload.outcome == 'failure' && steps.upload_retry.outcome != 'success'
        run: |
          echo "TestFlight upload failed on both attempts." >&2
          exit 1

      - name: Enable internal TestFlight testing
        if: steps.upload.outcome == 'success' || steps.upload_retry.outcome == 'success'
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ needs.resolve-ipa.outputs.build }}
          TESTFLIGHT_POLL_SECONDS: "30"
          TESTFLIGHT_POLL_TIMEOUT: "3600"
        run: python3 scripts/appstore-connect/enable_testflight_build.py

      - name: Clean up older TestFlight builds
        env:
          TESTFLIGHT_KEEP_BUILD: ${{ needs.resolve-ipa.outputs.build }}
        run: python3 scripts/appstore-connect/cleanup_testflight_builds.py

name: Enable TestFlight Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/revolut-full-redesign-b0ff'
    paths:
      - '.github/triggers/testflight-enable-build'

permissions:
  contents: read

jobs:
  enable-testflight-build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: at.paxdesign.livechat
      TESTFLIGHT_POLL_SECONDS: "30"
      TESTFLIGHT_POLL_TIMEOUT: "3600"
      TESTFLIGHT_INTERNAL_TESTER_EMAIL: awjime29@icloud.com
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve TestFlight target build
        id: target
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' paxdesign-booking/ios-live-chat/project.yml | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "TestFlight target build: $BUILD"

      - name: Validate App Store Connect private key
        run: python3 scripts/appstore-connect/prepare-asc-key.py

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --break-system-packages PyJWT cryptography

      - name: Enable TestFlight build for internal testing
        env:
          TESTFLIGHT_TARGET_BUILD: ${{ steps.target.outputs.build }}
        run: python3 scripts/appstore-connect/enable_testflight_build.py

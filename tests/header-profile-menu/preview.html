<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header profile dropdown — Apple UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,510;14..32,590;14..32,600&display=swap">
<link rel="stylesheet" href="../../paxdesign-booking/assets/customer-auth/css/pdx-customer-ui.css">
<link rel="stylesheet" href="../../paxdesign-booking/assets/customer-auth/css/pdx-auth.css">
<style>
html, body {
  margin: 0;
  min-height: 100%;
  background: #111;
  font-family: "Exo 2", sans-serif;
}
.preview-note {
  margin: 0;
  padding: 14px 20px 0;
  color: #86868b;
  font-size: 12px;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 24px;
  background: #0b0b0b;
  border-bottom: 1px solid rgba(255,255,255,.08);
  overflow: hidden;
}
.preview-brand {
  color: #fff;
  font-weight: 700;
  letter-spacing: .08em;
}
#pdx-auth-bar.pdx-cx-shell {
  margin-left: auto;
}
#pdx-auth-bar.pdx-cx-shell .pdx-auth-account-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: 980px;
  background: transparent;
  color: #fff;
  font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
}
.pdx-account-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f5f5f7;
  color: #1d1d1f;
  font-weight: 600;
}
.pdx-account-avatar--header { width: 32px; height: 32px; font-size: 12px; }
.pdx-account-avatar--menu { width: 46px; height: 46px; font-size: 17px; }
</style>
</head>
<body>
<p class="preview-note">This is the header profile dropdown that opens from the name in the public header — not the /account page.</p>
<header class="preview-header">
  <div class="preview-brand">PAXDESIGN</div>
  <div id="pdx-auth-bar" class="pdx-cx-shell pdx-auth-bar--header pdx-auth-bar--menu-open">
    <div class="pdx-auth-bar-inner">
      <button type="button" class="pdx-auth-account-btn pdx-cx-btn pdx-cx-btn--ghost pdx-auth-header-btn" aria-haspopup="true" aria-expanded="true">
        <span class="pdx-auth-account-identity">
          <span class="pdx-account-avatar pdx-account-avatar--header">A</span>
          <span>ALKHA</span>
        </span>
      </button>
      <div class="pdx-auth-menu pdx-auth-menu--apple is-open" style="position:fixed;top:72px;right:24px;width:300px;z-index:10050">
        <div class="pdx-auth-menu-head">
          <div class="pdx-auth-menu-identity">
            <span class="pdx-account-avatar pdx-account-avatar--menu">A</span>
            <div class="pdx-auth-menu-identity-text">
              <div class="pdx-auth-menu-name">ALKHA</div>
              <div class="pdx-auth-menu-email">gltcrtl.play@gmail.com</div>
              <div class="pdx-auth-menu-status pdx-auth-menu-status--verified">
                <span class="pdx-auth-menu-status__icon"><svg class="pdx-auth-menu-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.4 12.4 10 17l8.6-9.6"/></svg></span>
                <span class="pdx-auth-menu-status__label">Verifiziert</span>
              </div>
            </div>
          </div>
        </div>
        <div class="pdx-auth-menu-actions">
          <button type="button" class="pdx-auth-menu-item" data-action="portal">
            <span class="pdx-auth-menu-item__icon"><svg class="pdx-auth-menu-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.4" y="3.4" width="7.2" height="8.4" rx="1.5"/><rect x="13.4" y="3.4" width="7.2" height="5" rx="1.5"/><rect x="13.4" y="11.4" width="7.2" height="9.2" rx="1.5"/><rect x="3.4" y="14.8" width="7.2" height="5.8" rx="1.5"/></svg></span>
            <span class="pdx-auth-menu-item__label">Kundenportal</span>
            <span class="pdx-auth-menu-item__chevron" aria-hidden="true"><svg class="pdx-auth-menu-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 5.8 15.6 12 9.4 18.2"/></svg></span>
          </button>
          <button type="button" class="pdx-auth-menu-item" data-action="profile">
            <span class="pdx-auth-menu-item__icon"><svg class="pdx-auth-menu-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.4 19.4c.75-3.15 3.2-4.8 6.6-4.8s5.85 1.65 6.6 4.8"/></svg></span>
            <span class="pdx-auth-menu-item__label">Mein Profil</span>
            <span class="pdx-auth-menu-item__chevron" aria-hidden="true"><svg class="pdx-auth-menu-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 5.8 15.6 12 9.4 18.2"/></svg></span>
          </button>
          <button type="button" class="pdx-auth-menu-item" data-action="account">
            <span class="pdx-auth-menu-item__icon"><svg class="pdx-auth-menu-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.85"/><path d="M12 3.25v2.1M12 18.65v2.1M4.75 4.75l1.48 1.48M17.77 17.77l1.48 1.48M3.25 12h2.1M18.65 12h2.1M4.75 19.25l1.48-1.48M17.77 6.23l1.48-1.48"/></svg></span>
            <span class="pdx-auth-menu-item__label">Mein Konto</span>
            <span class="pdx-auth-menu-item__chevron" aria-hidden="true"><svg class="pdx-auth-menu-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 5.8 15.6 12 9.4 18.2"/></svg></span>
          </button>
        </div>
        <div class="pdx-auth-menu-footer">
          <button type="button" class="pdx-auth-menu-item pdx-auth-menu-item--logout" data-action="logout">
            <span class="pdx-auth-menu-item__icon"><svg class="pdx-auth-menu-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 20.4H6.1A2.1 2.1 0 0 1 4 18.3V5.7A2.1 2.1 0 0 1 6.1 3.6h3.5"/><path d="M15.2 16.4 20 12l-4.8-4.4"/><path d="M19.6 12H9.5"/></svg></span>
            <span class="pdx-auth-menu-item__label">Abmelden</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
</body>
</html>
